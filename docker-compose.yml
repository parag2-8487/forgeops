# ForgeOps Phase 0 — the unprofiled DEFAULT profile: postgres, redis, opa,
# backend, frontend. That five-service set is exactly what
# `docker compose up -d --wait` starts on a fresh clone (Appendix E criterion 4).
#
# No optional service is declared here: `infisical` (profile vault) and
# `agent-dev` (profile tools) are added only by their owning implementation
# tasks, so they cannot be pulled in by the default command.
#
# Every service loads the committed ./.env.example as a REQUIRED env file and
# ./.env as an OPTIONAL override, which is what lets a fresh clone start with no
# .env present. Compose interpolation does not read env_file, so every ${VAR} in
# a port or build argument carries its own safe default.
#
# Design: §2.2, §13.3, §14.2, §16.4
name: forgeops

x-service-env: &service-env
  - path: ./.env.example
    required: true
  - path: ./.env
    required: false

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
    env_file: *service-env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # design §6.4, §6.7: the two-role arrangement. Migration `0002` creates
      # `forgeops_app` and `forgeops_migrator` with NO password, because a migration is
      # committed source; this init script grants LOGIN and a local password from the
      # untracked `.env`, and grants the migrator CREATE on `public` so the first
      # migration can run at all. `scripts/check-db-roles.py` fails the build if the
      # split is not actually in effect, so this mount is load-bearing rather than
      # convenience.
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis/redis-stack-server:7.4.0-v3@sha256:7d8e657d60d525534d6abe96e7645ab30ef1b4f1ffedc6eeb2d4d4283b3a49b9
    env_file: *service-env
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  opa:
    # Debt D5's second clause asked for `1.4.2-rootless`. That tag DOES NOT EXIST:
    # OPA 1.x publishes `1.4.2`, `-static`, `-debug`, `-envoy*` and `-istio*` and no
    # `-rootless` variant at all (the suffix was retired after the 0.x line). The
    # premise behind the request is also no longer true — this image already runs
    # unprivileged. Its config declares user `1000:1000`, and the build history shows
    # `ARG USER=1000:1000` followed by `USER 1000:1000`, because OPA 1.x is built on
    # a Chainguard apko base that is non-root by default.
    #
    # So the security intent of D5's OPA clause is already satisfied by the pinned
    # reference below, and no check requires a `-rootless` suffix: a gate that can
    # never pass is worse than no gate. Recorded rather than silently dropped.
    image: openpolicyagent/opa:1.4.2@sha256:35a093d9ae828373cf88f68ecaa8189ab26287468074a3b78f0601d9c8b7a4f5
    env_file: *service-env
    # `/policies/mcp` AND `/policies/agent`, not `/policies` — D-57. Task 6.4 put Cerbos's
    # YAML policies in `policies/cerbos/`, and `opa run /policies` loads every YAML under
    # the path as a DATA document: six files each declaring `apiVersion` at the top level
    # collide and OPA exits with "6 errors occurred during loading: ... merge error" before
    # it binds a port. Each engine is given only its own subtree, so adding a third can
    # never break a second.
    #
    # `/policies/agent` was MISSING, and its absence disabled the governance chokepoint
    # entirely. `policies/agent/governance.rego` declares `package forgeops.governance` with
    # the `decision` rule, and `src/policies/opa.py` queries
    # `/v1/data/forgeops/governance/decision` for every submission. With that subtree
    # unloaded the document does not exist, OPA answers with no result, and the client fails
    # closed — correctly — so every generation run ended:
    #
    #     ERROR src.policies.opa: governance policy document undefined
    #       at /v1/data/forgeops/governance/decision
    #
    # and the SSE stream terminated `error` instead of `complete`. Nothing was broken except
    # that OPA had never been given the policy it was being asked about.
    #
    # `--ignore=*_test.rego` keeps `governance_test.rego` out of the server: those rules
    # exist for `opa test`, and loading them puts test fixtures in the same data tree the
    # chokepoint reads.
    command:
      [
        "run",
        "--server",
        "--addr=0.0.0.0:8181",
        "--log-level=info",
        "--ignore=*_test.rego",
        "/policies/mcp",
        "/policies/agent",
      ]
    volumes:
      - ./policies/mcp:/policies/mcp:ro
      - ./policies/agent:/policies/agent:ro
    ports:
      - "127.0.0.1:${OPA_PORT:-8181}:8181"
    healthcheck:
      test: ["CMD", "/opa", "version"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── §1.11 (task 6.4): app RBAC sidecar (Tech-Stack §9, design §5.5) ─────────
  # A sidecar, and NOT embeddable in the agent (Research §B7): the agent's half of policy
  # evaluation is in-process Rego (D-30). This process answers one question — may this
  # principal take this action on this resource — for the backend only.
  #
  # Unlike Authentik, Cerbos IS in /health/ready (task 6.4). The difference is real rather
  # than a matter of taste: an IdP outage stops new logins while already-authenticated
  # traffic keeps working, but an authorisation outage stops every non-public request,
  # because deny-by-default means a request whose permission cannot be evaluated is
  # refused. A replica that cannot reach Cerbos should be taken out of service.
  cerbos:
    image: ghcr.io/cerbos/cerbos:0.54.0@sha256:211c261f6031675522a35c6055b13fd719c4aff13747307e4bcb6907326537ef
    command: ["server", "--config=/config/cerbos.yaml"]
    env_file: *service-env
    volumes:
      - ./policies/cerbos:/policies:ro
      - ./config/cerbos:/config:ro
    ports:
      - "127.0.0.1:${CERBOS_HTTP_PORT:-3592}:3592"
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--config=/config/cerbos.yaml"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ── §1.11 (task 6.3): the identity provider, in the DEFAULT profile ─────────
  # Not optional, and §2.3 is explicit about why: under deny-by-default routing every
  # non-public route needs a verified principal, so an API with no IdP is an API that
  # can only serve /health. Putting Authentik behind a profile would make the default
  # `docker compose up` produce a stack that looks healthy and cannot log anyone in.
  #
  # `2026.5.6` is the newest published patch of the `2026.5` line §16.4 names; the
  # digest below was resolved from the registry, not written by hand.
  #
  # Deliberately NOT in /health/ready (§6.3): an IdP outage must degrade login, not the
  # readiness of already-authenticated traffic. D-53 gives that degradation a
  # distinguishable response instead of letting it look like a credential failure.
  authentik-server: &authentik
    image: ghcr.io/goauthentik/server:2026.5.6@sha256:ed120caf710ccf82ef0026f0bc74e51615bc95ebff228a7a2d6fc60c441c3868
    command: server
    env_file: *service-env
    environment:
      # Only the two TOPOLOGY facts live here; every other Authentik variable is
      # delivered by env_file under Authentik's own name (see .env.example). Compose
      # interpolation does not read env_file, so a `${VAR}` here would be EMPTY on a
      # fresh clone with no `.env` — which is how a container ends up connecting to
      # localhost and reporting an unhelpful DNS error.
      #
      # Authentik shares the Postgres SERVER, in its own DATABASE
      # (`AUTHENTIK_POSTGRESQL__NAME`). §13.3 says "sharing the existing Postgres and
      # Redis", and a separate database is what makes that safe: Authentik manages its
      # own schema with its own migrations, so pointing it at `forgeops` would put ~90
      # foreign tables next to the Alembic-managed ones, and
      # `alembic revision --autogenerate` would then propose dropping every one of them
      # (test_alembic_autogenerate_clean.py exists to catch exactly that drift).
      # `scripts/postgres-init/20-authentik-database.sh` creates the database on first
      # boot.
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_REDIS__HOST: redis
    ports:
      - "127.0.0.1:${AUTHENTIK_PORT:-9000}:9000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 5s
      # Authentik runs its own migrations on first boot against an empty database, which
      # is minutes rather than seconds. 30 retries at 10s is the ceiling that keeps
      # `up -d --wait` from failing on a cold volume.
      retries: 30

  # Same image, different command. The worker runs Authentik's background tasks; without
  # it the server accepts logins but never completes an outpost or e-mail task, which
  # looks like an intermittent IdP rather than a missing container.
  authentik-worker:
    <<: *authentik
    command: worker
    # A worker publishes no port. Inheriting the server's `ports` would try to bind 9000
    # twice and fail the whole stack.
    ports: []
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ── §11.7's self_hosted tier, made actually reachable ───────────────────────
  # Every other endpoint in `backend/config/model-tiers.yaml` needs a hosted key, and
  # `.env.example` ships `LLM_KEY_*=placeholder` on purpose. So the six-tier cascade had
  # no endpoint it could reach: `ModelRouter.complete` returned EXHAUSTED for every tier,
  # generation could only render templates, and `generation_runs.served_from` could never
  # say anything but `template`. This service is the endpoint that changes that.
  #
  # UNPROFILED, and that is the decision. Behind a profile the default stack would still
  # have no reachable model, so `served_from='provider'` would be unreachable on a fresh
  # clone and the fallback would silently be the only path again — the exact condition
  # this service exists to remove. Registered in `scripts/compose-default-services.txt`
  # alongside the other defaults.
  #
  # No service `depends_on` it. The backend builds its router from configuration and
  # discovers reachability per request through the breaker, so gating backend startup on a
  # multi-gigabyte model pull would trade a working degradation for a slow boot.
  ollama:
    image: ollama/ollama:0.12.6@sha256:a61a8fd395dbb931cc8cb1b5da7a2510746575c87113fdc45b647ee59ef7f808
    env_file: *service-env
    # The image's entrypoint is `/bin/ollama` and `serve` blocks, so the pull cannot be a
    # second command — it has to run against the server this process starts. Pulling at
    # first boot rather than baking weights into an image is also what keeps the reference
    # above digest-pinnable: a layer carrying a gigabyte of weights would have to be built
    # and published somewhere before it could be pinned at all.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        /bin/ollama serve &
        until /bin/ollama list >/dev/null 2>&1; do sleep 1; done
        /bin/ollama pull "$${SELF_HOSTED_MODEL_ID}"
        /bin/ollama pull "$${SELF_HOSTED_EMBEDDING_MODEL_ID}"
        wait
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      # The weights, so a restart is not another gigabyte of download.
      - ollamamodels:/root/.ollama
    healthcheck:
      # Green means THE CONFIGURED MODELS ARE PRESENT, not merely that a port is open. A
      # probe that only checked the port would report ready while every completion came
      # back `model "..." not found`, which reads as a routing bug rather than an
      # unfinished download.
      test:
        [
          "CMD-SHELL",
          "/bin/ollama list 2>/dev/null | grep -Fq \"$${SELF_HOSTED_MODEL_ID}\" && /bin/ollama list 2>/dev/null | grep -Fq \"$${SELF_HOSTED_EMBEDDING_MODEL_ID}\"",
        ]
      interval: 10s
      timeout: 10s
      # First boot downloads both models over the network, which is minutes rather than
      # seconds — the same reasoning as Authentik's 30 retries above.
      retries: 60
      start_period: 30s

  # A SECOND, GENUINELY SEPARATE MODEL SERVER, so cross-endpoint failover can be exercised
  # against something real instead of a test double.
  #
  # WHY THIS EXISTS. Five of the six tiers name hosted vendors and `LLM_KEY_*` are placeholders,
  # so those endpoints cannot be reached at all — which left the cascade, the circuit breaker and
  # the failover path proven only against fakes. The `self_hosted` tier's declared secondary
  # (`glm-5.2`) pointed at the SAME `SELF_HOSTED_BASE_URL` as its primary, so it could not
  # demonstrate failover either: one server going down took both entries with it.
  #
  # SEPARATE PROCESS, SEPARATE CONTAINER, SEPARATE PORT — which is what makes `docker compose stop`
  # on the primary a real endpoint outage rather than a simulated one. It SHARES the weights
  # volume, so standing it up costs no second download; the volume is read by both and written by
  # neither after first pull, and the model is already present so the pull is a no-op.
  #
  # It is in the default profile alongside `ollama` because a cascade whose secondary is optional
  # is not a cascade — the tier config names this endpoint, and `load_tier_config` validates that
  # every named endpoint resolves at startup.
  ollama-secondary:
    image: ollama/ollama:0.12.6@sha256:a61a8fd395dbb931cc8cb1b5da7a2510746575c87113fdc45b647ee59ef7f808
    env_file: *service-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        /bin/ollama serve &
        until /bin/ollama list >/dev/null 2>&1; do sleep 1; done
        /bin/ollama pull "$${SELF_HOSTED_MODEL_ID}"
        wait
    ports:
      - "127.0.0.1:${OLLAMA_SECONDARY_PORT:-11435}:11434"
    volumes:
      - ollamamodels:/root/.ollama
    healthcheck:
      # Only the completion model, not the embedding one: this endpoint exists to answer
      # completions when the primary cannot, and embeddings are not part of the cascade.
      test:
        [
          "CMD-SHELL",
          "/bin/ollama list 2>/dev/null | grep -Fq \"$${SELF_HOSTED_MODEL_ID}\"",
        ]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-ForgeOps}
    env_file: *service-env
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Added by task 2.3 (debt D2). Without a healthcheck, `docker compose up -d
      # --wait` only waits for this container to be *running*, so the smoke job
      # would report success on a Next.js server that started and then failed to
      # serve. `node` is guaranteed present in the runtime image, unlike curl.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: { context: ./backend, target: runtime }
    env_file: *service-env
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres: { condition: service_started }
      redis: { condition: service_started }
      opa: { condition: service_started }
    healthcheck:
      # Liveness only: /health performs NO dependency I/O (§4.4).
      # Readiness is polled separately by scripts/dev-up.sh.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The ARQ worker that RUNS the work the API enqueues.
  #
  # Without this service the stack accepts work and never performs it, silently. `.env.example` sets
  # `TASK_DISPATCHER=arq`, so `POST /approvals/{id}/approve` enqueues the apply and returns 200; the
  # job lands in Redis and stays there. `docker compose exec redis redis-cli --scan` showed a growing
  # list of `arq:job:*` keys and no consumer. What an operator saw was a change set stuck at
  # `approved` for ever, with nothing in any log to say why: the approval had succeeded and the apply
  # had never been attempted.
  #
  # `make worker` has always existed and runs exactly this command, so the worker was documented and
  # simply absent from the stack that `make up` starts. Same image and same env_file as the backend --
  # a worker that disagrees with the API about configuration is a class of bug worth designing out --
  # and no ports, because it serves nothing.
  worker:
    build: { context: ./backend, target: runtime }
    env_file: *service-env
    # `python -m arq`, not `arq`. The runtime image installs the library but no console script, so
    # `arq src.worker.WorkerSettings` fails at container start with
    # `exec: "arq": executable file not found in $PATH`. The module entry point is the same code.
    command: ["python", "-m", "arq", "src.worker.WorkerSettings"]
    depends_on:
      postgres: { condition: service_started }
      redis: { condition: service_started }
      opa: { condition: service_started }
    healthcheck:
      # ARQ's OWN health check, not a process probe. The worker holds no socket, so there is nothing
      # to curl; `--check` reads the health key the worker itself writes to Redis and exits non-zero
      # when it is missing or stale. That answers "is this worker consuming the queue", which is the
      # only useful question about it -- a `pgrep` would pass for a process wedged and consuming
      # nothing, and the first version used `pgrep` anyway, which is not even in this image:
      # `/bin/sh: 1: pgrep: not found`, exit 127, unhealthy for ever.
      #
      # `health_check_interval` in WorkerSettings governs how often the key is refreshed, so the
      # interval here is deliberately the looser of the two.
      test: ["CMD", "python", "-m", "arq", "src.worker.WorkerSettings", "--check"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Added by task 13.15: Infisical vault for BYO-key secret management.
  # Only starts with `docker compose --profile vault up -d --wait`.
  infisical:
    profiles: ["vault"]
    # Debt D5 (design §0.5): this was the one image reference in the file without a
    # digest, so the `vault` profile was the only service whose bytes were not
    # reproducible.
    #
    # Deviation recorded, and it is a version bump rather than a pure pin. The design
    # names v0.91.1, but that tag is NO LONGER PUBLISHED — `docker buildx imagetools
    # inspect infisical/infisical:v0.91.1` answers `not found`, and the repository's
    # tag list now starts at v0.162.x. A digest cannot be resolved for a pruned tag,
    # so pinning the named version is impossible; leaving it unpinned would keep an
    # unpullable reference in the file and defer the failure to task 10.4, which is
    # the leaf that first starts this container for real. Pinning the newest published
    # release by tag AND digest is the only option that leaves the profile working.
    image: infisical/infisical:v0.162.15@sha256:bcb31ccb2a3784315ad9d9e180a9c53c6423f0daf3087c3bb158093de99617f2
    env_file: *service-env
    ports:
      - "127.0.0.1:${INFISICAL_PORT:-8080}:8080"
    depends_on:
      postgres: { condition: service_started }
      redis: { condition: service_started }

  # Added by task 9.5: devtools container for OpenTofu integration tests.
  # Only starts with `docker compose --profile tools up -d --wait`.
  agent-dev:
    profiles: ["tools"]
    build:
      context: ./agent
      target: devtools
    env_file: *service-env
    volumes:
      - ./agent:/workspace:rw
      - tofucache:/var/cache/tofu/plugins
    command: ["sleep", "infinity"]

volumes:
  pgdata: {}
  redisdata: {}
  tofucache: {}
  # The Ollama model store. Named rather than anonymous so `docker compose down` without
  # `-v` does not throw away the weights and make the next `up` another long download.
  ollamamodels: {}
