# SPDX-License-Identifier: FSL-1.1-ALv2
#
# The end-to-end overlay (design.md §8.3.2, criterion 10).
#
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --wait
#
# WHAT THIS ADDS TO THE BASE STACK
# The base file already brings up postgres, redis, opa, cerbos, authentik-server, authentik-worker,
# backend and frontend as default services. This overlay adds the one service §8.3.2 names that did
# not exist — the real agent, built from the new `runtime` target with a fixture Node.js project
# mounted — and points the backend and frontend at each other the way a browser will see them.
#
# ─────────────────────────────────────────────────────────────────────────────
# A DELIBERATE DEVIATION FROM §8.3.2, RECORDED HERE BECAUSE IT IS ONE
#
# §8.3.2 states the OIDC issuer for this job is "a small signed-JWT fixture service, not Authentik",
# on the grounds that Authentik's cold start is expensive and the flow it adds is covered by the
# dedicated `auth` job.
#
# This overlay uses Authentik. The reason is not preference: a signed-JWT fixture service has no
# interactive authorization endpoint. It can mint a token, which is all the `auth` job needs, but it
# cannot render a login form — and §12.6 step 1 is a human logging in through a browser. Playwright
# cannot type a password into a service that has no page. Satisfying §8.3.2 literally would mean the
# journey either skips step 1 or fakes it by injecting a session, and a journey that fakes its first
# step is not evidence of anything.
#
# The rationale §8.3.2 gives is a cost concern rather than a correctness one, and it is already
# mitigated: `scripts/ci/start-authentik.sh` exists, health-gates the server on `ak healthcheck`,
# and waits for the authorization flow and the four scopes to be present before returning. The
# split §8.3.2 was protecting — that the `auth` job proves the token path without a browser — is
# untouched; that job still uses the fixture issuer in `test_auth_oidc_flow.py`.
#
# So: the fixture issuer stays where it can do the job, and the journey uses the issuer that can
# render a login form. This is noted in the phase record as a decision rather than left for a
# reviewer to spot as a discrepancy.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── the real agent, which §8.3.2 requires and no target previously built ──
  agent:
    build:
      context: ./agent
      target: runtime
    # Idles. The journey mints a pairing code through the API, then:
    #   docker compose ... exec -T agent forgeops-agent pair --code <code>
    #   docker compose ... exec -d -T agent forgeops-agent run
    # Two separately checkable exit statuses. An entrypoint that paired itself would collapse both
    # into one container start, and a pairing failure would be indistinguishable from a crash.
    command: ["sleep", "infinity"]
    environment:
      # Over the compose network, so the journey exercises the real WebSocket path rather than a
      # loopback shortcut that would not survive a container boundary.
      #
      # `wss://` AND A DEDICATED LISTENER, because the hub authenticates with two secrets and one of
      # them is a client certificate. `TlsPeerCertificate` reads it from the TLS connection the
      # backend terminated and returns None on a plaintext socket, so `session.connect` over `ws://`
      # was refused with "client certificate and bearer device token are both required". Requiring a
      # client certificate is a property of the LISTENER, so it cannot be turned on for the port the
      # browser uses — see `backend/src/agent_listener.py` for why this is a second listener rather
      # than a trusted header.
      #
      # THE PATH IS `/api/v1/ws/agent`, and this said `/api/v1/agent/ws`. `WS_AGENT_PATH` in
      # `backend/src/websocket/routes.py` and `.env.example` both spell it the first way; only this
      # file had the segments transposed. It was harmless for exactly as long as the agent never
      # dialled — `App.Run` served a Phase 0 stub that returned nil without opening a socket — so
      # nothing ever resolved the URL. `socketURL` APPENDS the route when the configured URL does
      # not already end in it, which is the right behaviour for a bare origin and means the
      # transposed value would have produced `/api/v1/agent/ws/api/v1/ws/agent` and a 404 that
      # looks like the hub being down.
      AGENT_BACKEND_WSS_URL: "wss://backend-agent:8443/api/v1/ws/agent"
      AGENT_STATE_DIR: "/var/lib/forgeops"
      # `file` rather than `auto`: `auto` prefers an OS keychain, and a container has none, so
      # leaving it to fall back would make the journey depend on a negative probe succeeding.
      AGENT_CREDENTIAL_STORE: "file"
      AGENT_IDENTITY_PROVIDER: "paired_device"
      # Where `changeset.apply` may write, and the only place it may. The executor confines every
      # path in a change set to this root; it is configuration and not an envelope member, because
      # a root carried in signed arguments would let a command relocate its own write boundary.
      AGENT_WORKSPACE_ROOT: "/workspace"
      AGENT_LOG_FORMAT: "json"
    volumes:
      # The fixture project, read-write because the journey's whole point is that the agent WRITES
      # generated artifacts into it and step 10 then verifies them on disk. Mounted read-only would
      # make the apply step fail for a reason unrelated to the code under test.
      - ./tests/e2e/fixture-project:/workspace:rw
      - agentstate:/var/lib/forgeops
    depends_on:
      backend:
        condition: service_healthy
      backend-agent:
        condition: service_healthy
    # The agent is a client. It must not be reachable from outside the compose network, and it
    # publishes no port.
    networks:
      default: {}

  # ── the agent's own mTLS listener ─────────────────────────────────────────
  #
  # The SAME application, on a second port, with `ssl_cert_reqs=CERT_REQUIRED`. It exists because
  # `/api/v1/ws/agent` authenticates the peer with a client certificate AND a bearer token, and a
  # client certificate can only be required for a whole TLS listener — not for one route. The
  # browser's port must stay plaintext-friendly, so the two audiences get two listeners.
  #
  # Adding this is what made the handshake possible at all. Before it, the agent dialled
  # `ws://backend:8000`, `TlsPeerCertificate` correctly found no peer certificate on a plaintext
  # socket, and every `session.connect` was refused with "client certificate and bearer device token
  # are both required" — so an approved change set could never be delivered.
  #
  # No published port: only the agent talks to it, over the compose network. Publishing it would
  # expose an mTLS endpoint whose whole access-control story is the client certificate.
  backend-agent:
    build: { context: ./backend, target: runtime }
    # Spelled out rather than `*service-env`: a YAML anchor is file-scoped, and this service exists
    # only in this file so there is no base definition to merge one in from. The two paths and their
    # `required` flags are copied from `x-service-env` in docker-compose.yml deliberately — the
    # listener must see the SAME configuration as the API it is a second listener for, and in
    # particular the same INTERNAL_CA_* pair, or it would issue its server certificate from a
    # different CA than the one the agent was given at pairing.
    env_file:
      - path: ./.env.example
        required: true
      - path: ./.env
        required: false
    environment:
      # `backend-agent` is the name the agent dials, so it must be in the server certificate's SAN
      # list or the agent's own verification rejects it.
      AGENT_TLS_SERVER_NAMES: "backend-agent,localhost,127.0.0.1"
      AGENT_TLS_PORT: "8443"
    command: ["python", "-m", "src.agent_listener"]
    ports:
      # PUBLISHED SO A HOST AGENT CAN REACH IT. Without this the listener is reachable only from
      # inside the Compose network, so a signed apply command could only ever be delivered to a
      # containerised agent — and `host-apply.spec.ts`, which drives the released binary as a host
      # process exactly as a user does, had nothing to dial.
      #
      # Same default and same 127.0.0.1 binding as `docker-compose.yml`, so the two stacks do not
      # disagree about where this listener is.
      - "127.0.0.1:${AGENT_TLS_HOST_PORT:-18443}:8443"
    depends_on:
      postgres: { condition: service_started }
      redis: { condition: service_started }
      opa: { condition: service_started }
    healthcheck:
      # Checked THROUGH mTLS, presenting the probe certificate the listener issues at start. So a
      # green check means the chain, the server key and `CERT_REQUIRED` all work — not merely that a
      # process holds the port. `/health` performs no dependency I/O (§4.4), so this stays liveness.
      #
      # A certificate is REQUIRED here, not optional: `--ssl-cert-reqs 2` is enforced for every
      # client, so a probe without one fails the handshake, the container is marked unhealthy, and
      # the agent's `depends_on: service_healthy` never releases. That is precisely what happened
      # before this presented one — the journey reported `service "agent" is not running`.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import ssl,urllib.request;d='/tmp/forgeops-agent-tls';ctx=ssl.create_default_context(cafile=d+'/ca.crt');ctx.load_cert_chain(d+'/probe.crt',d+'/probe.key');urllib.request.urlopen('https://localhost:8443/health',timeout=5,context=ctx)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      default: {}

  # ── the backend, told where the browser actually is ──────────────────────
  backend:
    # TWO ADDRESSES FOR ONE IdP, because no single one works from both sides.
    #
    # An earlier version of this file invented a shared hostname, `forgeops-idp.local`, mapped to the
    # host gateway here and to 127.0.0.1 through a Chromium `--host-resolver-rules` flag in
    # playwright.config.ts. It worked for the Playwright-launched browser and for nothing else: a
    # person opening the app got `DNS_PROBE_FINISHED_BAD_CONFIG`, because a name that only resolves
    # under a launch flag does not resolve for a real browser. That was a defect, not a setting.
    #
    # The constraint is genuine and worth stating so nobody re-invents the hack. The backend resolves
    # `authentik-server` over the Compose network and a host browser cannot. The host's published
    # `localhost:${AUTHENTIK_PORT}` is not reachable from inside a container. The published ports are
    # bound to 127.0.0.1 deliberately -- `check-compose-validate.py` enforces it -- so exposing the
    # LAN interface to bridge the gap is not available either.
    #
    # So the backend uses the INTERNAL address for everything server-to-server, which also keeps the
    # token's `iss` claim equal to OIDC_ISSUER, and OIDC_PUBLIC_BASE_URL rewrites the one URL a
    # browser has to open: the authorization redirect.
    environment:
      # Where the OIDC callback sends a BROWSER once the code exchange succeeds. Without this the
      # callback would bounce to the default localhost:3000, which is correct for a developer and
      # wrong inside CI if the frontend is published elsewhere.
      FRONTEND_BASE_URL: "${E2E_FRONTEND_URL:-http://localhost:3000}"
      # Internal: how THIS process reaches the IdP. Also the issuer it verifies `iss` against.
      OIDC_ISSUER: "${E2E_OIDC_ISSUER:-http://authentik-server:9000/application/o/forgeops/}"
      # Public: how a BROWSER reaches it. Only the authorization redirect uses this.
      OIDC_PUBLIC_BASE_URL: "${E2E_OIDC_PUBLIC_BASE_URL:-http://localhost:9000}"
      OIDC_REDIRECT_URL: "${E2E_OIDC_REDIRECT_URL:-http://localhost:8000/api/v1/auth/callback}"
      # The audience the IdP actually mints, which for this deployment is the OIDC client id.
      #
      # §7.1's separation is between the PRODUCT API audience and the MCP GATEWAY audience, and that
      # stays intact: MCP_OIDC_ISSUERS/MCP_OIDC_AUDIENCE are configured separately, so a gateway token
      # still cannot be replayed here. What does not work is inventing a third value: Authentik's
      # provider `audience` field is silently ignored, and emitting `aud` from a scope mapping also
      # rewrites the ID TOKEN, whose audience OIDC requires to be the client id -- doing that made
      # /auth/callback fail id-token verification with a 401.
      OIDC_APP_AUDIENCE: "${E2E_OIDC_APP_AUDIENCE:-forgeops-frontend}"
      CORS_ALLOW_ORIGINS: "${E2E_FRONTEND_URL:-http://localhost:3000}"
      APP_ENV: "test"

  # ── the frontend, told where the API is ──────────────────────────────────
  frontend:
    environment:
      NEXT_PUBLIC_API_BASE_URL: "${E2E_API_BASE_URL:-http://localhost:8000/api/v1}"
      NEXT_PUBLIC_OIDC_LOGIN_PATH: "/auth/login"

volumes:
  # Kept out of the fixture project's bind mount so a `git status` on the fixture stays clean and
  # the journey's on-disk assertions are not competing with credential files.
  agentstate: {}
