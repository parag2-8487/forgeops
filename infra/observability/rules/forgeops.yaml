# Recording rules — Phase 2 §2.10.
#
# WHY RECORDING RULES AT ALL. The AI cost dashboard sums a counter per tenant per model over a month. Run as
# a live query on every refresh, that recomputes the entire range each time — and at that point the dashboard
# is the load on the system it is monitoring. A recording rule evaluates once per interval and the panel reads
# a single series.
#
# WHY THE NAMES FOLLOW PROMETHEUS'S CONVENTION (`level:metric:operation`). A recorded series that looked like
# a raw metric would be summed again by somebody who did not know it was pre-aggregated, which double-counts.
# The colons are the warning.

groups:
  - name: forgeops-ai-cost
    interval: 1m
    rules:
      # Per tenant, per model. This is the series §2.10's cost dashboard reads.
      #
      # `increase` OVER A FIXED WINDOW rather than the raw counter, because a counter's absolute value is
      # meaningless across restarts: it resets, and a dashboard showing the raw value would drop to zero
      # whenever the backend was redeployed. `increase` handles the reset.
      - record: tenant_model:gen_ai_cost:increase1h
        expr: |
          sum by (forgeops_tenant_id, gen_ai_response_model) (
            increase(gen_ai_cost_total[1h])
          )

      - record: tenant_model:gen_ai_cost:increase24h
        expr: |
          sum by (forgeops_tenant_id, gen_ai_response_model) (
            increase(gen_ai_cost_total[24h])
          )

      # Tokens, split by direction. Kept separate because they price differently on every provider, so a
      # combined total cannot be converted back into money.
      - record: tenant_model:gen_ai_input_tokens:increase24h
        expr: |
          sum by (forgeops_tenant_id, gen_ai_response_model) (
            increase(gen_ai_usage_input_tokens[24h])
          )

      - record: tenant_model:gen_ai_output_tokens:increase24h
        expr: |
          sum by (forgeops_tenant_id, gen_ai_response_model) (
            increase(gen_ai_usage_output_tokens[24h])
          )

  - name: forgeops-application
    interval: 15s
    rules:
      # Request rate, latency and errors — the three panels §2.10's application dashboard shows.
      - record: route:http_requests:rate5m
        expr: |
          sum by (http_route, http_response_status_code) (
            rate(http_server_duration_milliseconds_count[5m])
          )

      # THE ERROR RATIO IS RECORDED WITH ITS DENOMINATOR GUARDED. `sum(5xx) / sum(all)` is NaN when there is
      # no traffic, and a panel rendering NaN as 0% would say "no errors" for a service that is not being
      # asked anything. `or vector(0)` is deliberately NOT used here for the same reason: it would invent a
      # zero. An absent series renders as "no data", which is the truth.
      - record: route:http_errors:ratio5m
        expr: |
          sum by (http_route) (
            rate(http_server_duration_milliseconds_count{http_response_status_code=~"5.."}[5m])
          )
          /
          sum by (http_route) (
            rate(http_server_duration_milliseconds_count[5m])
          )

      - record: route:http_latency_p95:5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (http_route, le) (rate(http_server_duration_milliseconds_bucket[5m]))
          )
