# SPDX-License-Identifier: FSL-1.1-ALv2
# ForgeOps CI — design.md §8.3.
#
# Stage order mirrors the design: paths-filter → pre-commit → lock-integrity →
# lint → test → build → e2e → audit → supply.
#
# Deliberately ABSENT in Phase 0, with the owning phase: Trivy image scan
# (Phase 4 §4.4), DeepEval LLM eval (Phase 2), k6 as a gate (needs a deployed
# target). No job calls a vendor model API or needs a real LLM key.
#
# The four authoritative root documents match NO component path filter, so
# editing them triggers no build — but Gitleaks still scans them in pre-commit.
#
# Every action is pinned to a full commit SHA: tags are mutable, SHAs are not.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  TOFU_VERSION: "1.12.5"
  PIP_TOOLS_VERSION: "7.6.0"

jobs:
  # ── 0. paths-filter ───────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    # paths-filter calls the PR "list files" API to compute the changed set, so it
    # needs pull-requests: read on top of the workflow-wide contents: read.
    # Without it the job fails with "Resource not accessible by integration".
    permissions:
      contents: read
      pull-requests: read
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            agent:
              - 'agent/**'
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'docker-compose.yml'
              - 'policies/**'
              - 'scripts/**'
              - 'Makefile'

  # ── 1. pre-commit (gitleaks, ruff, gofmt, prettier, hygiene) ──────────────
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum
      # Completion criterion 9: clean on a fresh clone, all files.
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  # ── 2. lock-integrity (Python hashes + six-platform tofu lock) ────────────
  lock-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - name: Install the pinned lock generator
        run: pip install "pip-tools==${PIP_TOOLS_VERSION}"
      # Regenerate both locks and fail on ANY diff.
      - name: Backend lock freshness (no diff allowed)
        run: bash scripts/check-lock-freshness.sh
      # tofu init -lockfile=readonly + six-platform freshness in an isolated copy.
      - name: OpenTofu six-platform lock integrity
        run: bash scripts/check-tofu-lock.sh

  # ── 3+4+5. agent: lint → test → build (working-directory: agent) ──────────
  agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum
      # internal/iac/integration_test.go calls t.Skip("tofu not found") without a
      # binary, so the four real-OpenTofu tests behind deliverable 0.8 — readonly
      # init, validate, plan and the plan-sample fixture — silently did not run.
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - name: Assert tofu is on PATH so the iac integration tests cannot skip
        run: tofu version
      # golangci-lint must be BUILT with a Go at least as new as the version it
      # analyses. The prebuilt release binaries are compiled with an older
      # toolchain and refuse to load a go1.26 config ("the Go language version
      # (go1.23) used to build golangci-lint is lower than the targeted Go version
      # (1.26)"), so it is installed from source with the Go set up above.
      - name: Install golangci-lint (built with this Go)
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.62.2
      - name: Lint
        run: golangci-lint run ./...
      # design.md §0.4.2 clause 2: a compile-time `var _ Iface = (*Impl)(nil)`
      # assertion cannot rot, but it can be ABSENT — and an absent assertion is
      # indistinguishable from a satisfied one until a signature changes and only
      # the injection site breaks, at runtime. That is the Go shape of D-23. The
      # checker is a standalone stdlib-only module, so it adds nothing to
      # agent/go.mod. It also fails when the discovered interface set is empty.
      - name: Interface-assertion completeness
        working-directory: .
        run: bash scripts/check-go-interface-assertions.sh
      - name: Interface-assertion checker's own negative fixtures
        working-directory: scripts/go/ifacecheck
        run: go test ./... -count=1
      # PRD §9: -race and -shuffle=on. Linux runners have cgo, so -race works.
      - name: Test
        run: go test -race -shuffle=on ./... -count=1
      - name: Build
        run: go build ./...

  # ── 6. backend: lint + test against real Postgres and Redis ───────────────
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
        env:
          POSTGRES_USER: forgeops
          POSTGRES_PASSWORD: forgeops
          POSTGRES_DB: forgeops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forgeops -d forgeops"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis/redis-stack-server:7.4.0-v3@sha256:7d8e657d60d525534d6abe96e7645ab30ef1b4f1ffedc6eeb2d4d4283b3a49b9
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://forgeops:forgeops@localhost:5432/forgeops
      REDIS_URL: redis://localhost:6379/0
      # tests/integration/conftest.py gates the schema tests on this variable.
      # It was never set, so all seven of criterion 14's assertions — vector(1536),
      # the HNSW cosine index, transaction-scoped ef_search, clean autogenerate and
      # the downgrade — skipped while this job paid to run a real pgvector service.
      FORGEOPS_TEST_DATABASE_URL: postgresql+asyncpg://forgeops:forgeops@localhost:5432/forgeops
      # No OPA service container: a service starts before checkout, so it cannot
      # mount ./policies. tests/integration/test_opa_policy_integration.py starts
      # the digest-pinned OPA image itself and tears it down.
      # Turns a self-skipping integration test into a CI failure, so a capability
      # probe can never quietly remove a criterion's only evidence again.
      FORGEOPS_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # CI installs the DEV lock with --require-hashes; the image installs only
      # the runtime lock (design.md §7.7).
      # A real redis-server BINARY, distinct from the service container above.
      # test_lifespan_health.py must start and stop its own Redis on a closed port
      # to observe the unavailable -> available readiness transition, so a service
      # container cannot satisfy it. Without the binary the test skipped.
      - name: Install a redis-server binary for the readiness-recovery test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server
      - name: Install dev lock with hash enforcement
        run: pip install --require-hashes -r requirements-dev.lock
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: pytest tests/ -q

  # ── 7. frontend: lint → test → build with a non-default browser URL ───────
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint .
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest --run
      # Criterion 6: a non-default browser URL must be inlined at build time.
      - name: Build with a non-default public URL
        env:
          NEXT_PUBLIC_API_BASE_URL: http://ci.example.test:9999/api/v1
          NEXT_PUBLIC_APP_NAME: ForgeOpsCI
        run: pnpm exec next build
      # Criterion 6: a non-default browser URL must be inlined at build time.
      # This step previously ended in `|| true`, so the one check that proves
      # NEXT_PUBLIC_* is baked into the bundle could never fail the job.
      - name: Assert the generated client uses the supplied build URL
        env:
          NEXT_PUBLIC_API_BASE_URL: http://ci.example.test:9999/api/v1
          # The build above always runs first here, so a missing .next is a bug,
          # not a reason to fall back to config-only assertions.
          FORGEOPS_REQUIRE_BUNDLE_CHECK: "1"
        run: bash ../scripts/check-frontend-container.sh

  # ── 8. compose smoke: exactly the five default services, from no .env ─────
  compose-smoke:
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Criterion 4: from a fresh clone with NO .env, the direct unprofiled
      # command selects exactly postgres, redis, opa, backend, frontend.
      - name: Assert the unprofiled service set is exactly five
        run: |
          test ! -e .env
          got="$(docker compose config --services | sort | tr '\n' ' ')"
          echo "unprofiled services: $got"
          test "$got" = "backend frontend opa postgres redis "
      - name: Assert optional profiles stay out of the default set
        run: |
          docker compose config --services | grep -qx infisical && exit 1 || true
          docker compose config --services | grep -qx agent-dev && exit 1 || true
          docker compose --profile vault config --services | grep -qx infisical
          docker compose --profile tools config --services | grep -qx agent-dev

  # ── 9. audit: dependency vulnerability gates ──────────────────────────────
  audit:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: go mod verify + govulncheck
        run: |
          cd agent && go mod verify && cd ..
          go install golang.org/x/vuln/cmd/govulncheck@latest
          bash scripts/check-govulncheck.sh
      - name: pip-audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --strict || pip-audit -r requirements.lock
      - name: pnpm audit
        working-directory: frontend
        run: pnpm audit --audit-level high || true

  # ── 10. supply: validate the release config on every PR (no publish) ──────
  supply:
    needs: changes
    if: needs.changes.outputs.agent == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum
      # Criterion 7: six CGO_ENABLED=0 targets must build from the release config.
      #
      # GITHUB_TOKEN is required: the action resolves its version and downloads
      # the GoReleaser release over the network, and without a token those
      # lookups are unauthenticated and get rate-limited on shared runners. The
      # step then dies in under a second with an empty log. release.yml already
      # sets the token, which is why the equivalent step there passes.
      #
      # The version is pinned to the exact release that the v0.0.1-rc3 release
      # run (30469955653) used — "Downloading .../download/v2.17.1/
      # goreleaser_Linux_x86_64.tar.gz" — so the floating "~> v2" constraint no
      # longer has to be resolved and the snapshot gate is reproducible.
      - name: GoReleaser snapshot (validates the release config, publishes nothing)
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          distribution: goreleaser
          version: "v2.17.1"
          args: release --snapshot --clean
          workdir: agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert six target binaries were produced
        working-directory: agent
        run: |
          count="$(find dist -type f -name 'forgeops-agent*' \( -perm -u+x -o -name '*.exe' \) | wc -l)"
          echo "binaries: $count"
          test "$count" -ge 6
