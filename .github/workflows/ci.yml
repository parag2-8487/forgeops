# SPDX-License-Identifier: FSL-1.1-ALv2
# ForgeOps CI — design.md §8.3.
#
# Stage order mirrors the design: paths-filter → pre-commit → lock-integrity →
# lint → test → build → e2e → audit → supply.
#
# Deliberately ABSENT in Phase 0, with the owning phase: Trivy image scan
# (Phase 4 §4.4), DeepEval LLM eval (Phase 2), k6 as a gate (needs a deployed
# target). No job calls a vendor model API or needs a real LLM key.
#
# The four authoritative root documents match NO component path filter, so
# editing them triggers no build — but Gitleaks still scans them in pre-commit.
#
# Every action is pinned to a full commit SHA: tags are mutable, SHAs are not.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  TOFU_VERSION: "1.12.5"
  PIP_TOOLS_VERSION: "7.6.0"

jobs:
  # ── 0. paths-filter ───────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    # paths-filter calls the PR "list files" API to compute the changed set, so it
    # needs pull-requests: read on top of the workflow-wide contents: read.
    # Without it the job fails with "Resource not accessible by integration".
    permissions:
      contents: read
      pull-requests: read
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            agent:
              - 'agent/**'
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'docker-compose.yml'
              - 'policies/**'
              - 'scripts/**'
              - 'Makefile'

  # ── 1. pre-commit (gitleaks, ruff, gofmt, prettier, hygiene) ──────────────
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum
      # Completion criterion 9: clean on a fresh clone, all files.
      # Debt D4: `pip install pre-commit` floated, so the linter that gates every
      # commit was itself unpinned. --require-hashes verifies every wheel by digest.
      - run: pip install --require-hashes -r scripts/requirements-tools.lock
      - run: pre-commit run --all-files --show-diff-on-failure

  # ── 2. lock-integrity (Python hashes + six-platform tofu lock) ────────────
  lock-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - name: Install the pinned lock generator
        run: pip install "pip-tools==${PIP_TOOLS_VERSION}"
      # Regenerate both locks and fail on ANY diff.
      - name: Backend lock freshness (no diff allowed)
        run: bash scripts/check-lock-freshness.sh
      # Debt D5's sibling item (design §0.5, §8.5): `-diff` marks a file BINARY, so a
      # lockfile change prints "Binary files differ" and cannot be reviewed at all.
      # A lockfile diff is the highest-signal artifact in a dependency bump.
      - name: Lockfiles must stay reviewable
        run: bash scripts/check-lockfile-attrs.sh
      # tofu init -lockfile=readonly + six-platform freshness in an isolated copy.
      - name: OpenTofu six-platform lock integrity
        run: bash scripts/check-tofu-lock.sh

  # ── 3+4+5. agent: lint → test → build (working-directory: agent) ──────────
  agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum
      # internal/iac/integration_test.go calls t.Skip("tofu not found") without a
      # binary, so the four real-OpenTofu tests behind deliverable 0.8 — readonly
      # init, validate, plan and the plan-sample fixture — silently did not run.
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - name: Assert tofu is on PATH so the iac integration tests cannot skip
        run: tofu version
      # Debt D4 (design §0.5). `go install ...@v1.62.2` resolved a MUTABLE tag against
      # nothing; agent/tools/go.mod pins the same version and its committed go.sum
      # verifies the bytes. scripts/go-tool.sh builds it and runs it from the agent
      # module, so `./...` still means the agent's packages.
      #
      # Building from source (rather than downloading a release binary) remains
      # necessary for the reason Phase 0 recorded: the prebuilt binaries are compiled
      # with an older toolchain and refuse to analyse a go1.26 module.
      - name: Lint (golangci-lint v1.62.2, checksum-verified)
        run: bash ../scripts/go-tool.sh github.com/golangci/golangci-lint/cmd/golangci-lint run ./...
      # design.md §0.4.2 clause 2: a compile-time `var _ Iface = (*Impl)(nil)`
      # assertion cannot rot, but it can be ABSENT — and an absent assertion is
      # indistinguishable from a satisfied one until a signature changes and only
      # the injection site breaks, at runtime. That is the Go shape of D-23. The
      # checker is a standalone stdlib-only module, so it adds nothing to
      # agent/go.mod. It also fails when the discovered interface set is empty.
      - name: Interface-assertion completeness
        working-directory: .
        run: bash scripts/check-go-interface-assertions.sh
      - name: Interface-assertion checker's own negative fixtures
        working-directory: scripts/go/ifacecheck
        run: go test ./... -count=1
      # PRD §9: -race and -shuffle=on. Linux runners have cgo, so -race works.
      - name: Test
        run: go test -race -shuffle=on ./... -count=1
      - name: Build
        run: go build ./...

  # ── 6. backend: lint + test against real Postgres and Redis ───────────────
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
        env:
          POSTGRES_USER: forgeops
          POSTGRES_PASSWORD: forgeops
          POSTGRES_DB: forgeops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forgeops -d forgeops"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis/redis-stack-server:7.4.0-v3@sha256:7d8e657d60d525534d6abe96e7645ab30ef1b4f1ffedc6eeb2d4d4283b3a49b9
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # The §6.4 two-role arrangement, exercised rather than described. The
      # application connects as `forgeops_app`, which `0007` REVOKEs
      # UPDATE/DELETE/TRUNCATE on `audit_events` from; migrations connect as
      # `forgeops_migrator`, which owns the schema. A single-role job would leave
      # `scripts/check-db-roles.py` unable to pass, which is the "gate that can never
      # pass" pattern D-51 exists to reject.
      DATABASE_URL: postgresql+asyncpg://forgeops_app:ci-only-not-a-real-secret@localhost:5432/forgeops
      REDIS_URL: redis://localhost:6379/0
      # tests/integration/conftest.py gates the schema tests on this variable.
      # It was never set, so all seven of criterion 14's assertions — vector(1536),
      # the HNSW cosine index, transaction-scoped ef_search, clean autogenerate and
      # the downgrade — skipped while this job paid to run a real pgvector service.
      #
      # It names the MIGRATOR, because the revision proofs run `alembic downgrade base`
      # then `upgrade head` through this URL: if they ran as the superuser, every table
      # would be owned by it and `check-db-roles.py`'s ownership assertion — the one
      # that catches "the app can drop the immutability triggers" — would fail.
      FORGEOPS_TEST_DATABASE_URL: postgresql+asyncpg://forgeops_migrator:ci-only-not-a-real-secret@localhost:5432/forgeops
      # Consumed by scripts/postgres-init/10-forgeops-roles.sh below. Synthetic and
      # self-labelling: this cluster exists for the duration of one job and is
      # reachable only from it.
      FORGEOPS_APP_DB_PASSWORD: ci-only-not-a-real-secret
      FORGEOPS_MIGRATOR_DB_PASSWORD: ci-only-not-a-real-secret
      POSTGRES_USER: forgeops
      POSTGRES_DB: forgeops
      PGHOST: localhost
      PGPORT: "5432"
      PGPASSWORD: forgeops
      # No OPA service container: a service starts before checkout, so it cannot
      # mount ./policies. tests/integration/test_opa_policy_integration.py starts
      # the digest-pinned OPA image itself and tears it down. Cerbos is the same
      # shape and for the same reason — scripts/ci/start-cerbos.sh starts it below.
      FORGEOPS_TEST_CERBOS_URL: http://127.0.0.1:3592
      # Turns a self-skipping integration test into a CI failure, so a capability
      # probe can never quietly remove a criterion's only evidence again.
      FORGEOPS_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # CI installs the DEV lock with --require-hashes; the image installs only
      # the runtime lock (design.md §7.7).
      # A real redis-server BINARY, distinct from the service container above.
      # test_lifespan_health.py must start and stop its own Redis on a closed port
      # to observe the unavailable -> available readiness transition, so a service
      # container cannot satisfy it. Without the binary the test skipped.
      - name: Install a redis-server binary for the readiness-recovery test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server
      - name: Install dev lock with hash enforcement
        run: pip install --require-hashes -r requirements-dev.lock
      # A service container starts before checkout, so it cannot mount
      # ./scripts/postgres-init the way Compose does (design §13.3). The runner invokes
      # the SAME script instead, over TCP with PGHOST/PGPASSWORD — so the two-role
      # setup CI proves is byte-identical to the one a developer gets, and cannot rot
      # into a CI-only variant that passes for a different reason.
      - name: Grant the two database roles a login (design §6.4)
        working-directory: .
        run: |
          sudo apt-get install -y -qq postgresql-client
          bash scripts/postgres-init/10-forgeops-roles.sh
      - name: Start the real Cerbos sidecar, digest-pinned (design §2.3, task 6.4)
        working-directory: .
        # Compiles the policy set with Cerbos's own test runner first, so a policy that
        # stopped matching §11.2's table fails here rather than as forty confusing
        # integration failures. Also asserts a non-zero policy count: a Cerbos with an
        # empty repository is healthy and denies everything.
        run: bash scripts/ci/start-cerbos.sh
      - name: No credential-shaped literal in a test source (secret-safety.md)
        working-directory: .
        # The second gate, beside gitleaks. gitleaks answers "is this a real credential";
        # this answers "does this LOOK like one", which is the question that actually blocks
        # a pull request — a synthetic placeholder that trips a scanner is a red required
        # check for the lifetime of the commit, and a scan people learn to wave through is
        # worse than no scan.
        run: python scripts/check-test-credentials.py backend/tests
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: pytest tests/ -q
      - name: Cerbos logs on failure
        if: failure()
        working-directory: .
        run: docker logs forgeops-ci-cerbos 2>&1 | tail -n 100
      # The revision proofs above left the schema at head, migrated by
      # `forgeops_migrator`. This asserts the arrangement actually took: that the
      # APPLICATION role cannot UPDATE, DELETE or TRUNCATE `audit_events`, does not own
      # the table, and that all three immutability triggers are installed. It connects
      # with the real DATABASE_URL, so it reports the privileges of whatever role that
      # URL authenticates as rather than the role the configuration claims.
      - name: Every route requires a principal or is an explicit public exemption
        working-directory: .
        # Deny-by-default is attached per route (§4.4), which a global dependency would
        # have made invisible at the route definition. The cost of per-route attachment
        # is that a new router can forget it; this is the check that pays that cost, and
        # it enumerates create_app().routes rather than a document about them.
        run: python scripts/check-route-auth.py
      - name: The application role must not be able to rewrite the audit log
        working-directory: .
        run: |
          # Migrate explicitly rather than relying on whatever revision the last test
          # left behind: some proofs deliberately end at `base`, and a check whose
          # result depends on test ordering is not a gate.
          (cd backend && DATABASE_URL="$FORGEOPS_TEST_DATABASE_URL" python -m alembic upgrade head)
          python scripts/check-db-roles.py

  # ── 7. auth: the code+PKCE flow and the RBAC matrix against REAL Authentik ─
  # design.md §8.3 (new job), §13.1, §13.3, §16.4, §17.1 D-34; task 6.3.
  #
  # Separate from `backend` on purpose. `backend` runs the same flow against a fixture
  # issuer, which is fast and covers the protocol; this job covers what only a real IdP
  # can: Authentik's own discovery document, its JWKS rotation, its group→claim mapping
  # and its consent/authorization flow. §8.3 also lists it among the heavy three, so it
  # is gated to matching changes or `main` rather than every pull request.
  #
  # Authentik is NOT a service container. A service container starts before checkout and
  # before any step, so its database cannot be created first — it would crash-loop on a
  # missing database while the health check counted down, and the job would fail with a
  # timeout that says nothing. Starting it from a step is also what
  # test_opa_policy_integration.py already does for OPA, for the same reason.
  auth:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
        env:
          POSTGRES_USER: forgeops
          POSTGRES_PASSWORD: forgeops
          POSTGRES_DB: forgeops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forgeops -d forgeops"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis/redis-stack-server:7.4.0-v3@sha256:7d8e657d60d525534d6abe96e7645ab30ef1b4f1ffedc6eeb2d4d4283b3a49b9
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://forgeops:forgeops@localhost:5432/forgeops
      REDIS_URL: redis://localhost:6379/0
      FORGEOPS_TEST_DATABASE_URL: postgresql+asyncpg://forgeops:forgeops@localhost:5432/forgeops
      FORGEOPS_TEST_REDIS_URL: redis://localhost:6379/1
      # Synthetic and self-labelling. This Authentik exists for the duration of one job
      # and is reachable only from it.
      AUTHENTIK_POSTGRESQL__PASSWORD: ci-only-not-a-real-secret
      AUTHENTIK_BOOTSTRAP_TOKEN: ci-only-not-a-real-secret-token
      AUTHENTIK_BOOTSTRAP_PASSWORD: ci-only-not-a-real-secret-admin
      FORGEOPS_TEST_OIDC_BASE_URL: http://localhost:9000
      # Task 6.3 requires this job to exercise "the real code+PKCE flow AND the RBAC
      # matrix against the container", so Cerbos runs here as well as in `backend`.
      # Selected by marker below, not by path.
      FORGEOPS_TEST_CERBOS_URL: http://127.0.0.1:3592
      PGHOST: localhost
      PGPORT: "5432"
      PGPASSWORD: forgeops
      POSTGRES_USER: forgeops
      POSTGRES_DB: forgeops
      # `require_capability("oidc")` skips locally and FAILS here, so this job cannot
      # report success while its only evidence quietly skipped (D-26).
      FORGEOPS_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev lock with hash enforcement
        working-directory: backend
        run: pip install --require-hashes -r requirements-dev.lock
      # The SAME script Compose mounts, invoked over TCP — so the database CI gives
      # Authentik is the one a developer gets, not a CI-only variant.
      - name: Create Authentik's own database (design §13.3)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          bash scripts/postgres-init/20-authentik-database.sh
      - name: Start real Authentik (server + worker), digest-pinned
        run: bash scripts/ci/start-authentik.sh
      - name: Start the real Cerbos sidecar, digest-pinned
        run: bash scripts/ci/start-cerbos.sh
      - name: The full OIDC code+PKCE flow and the RBAC matrix against the containers
        working-directory: backend
        # Both capability markers, because task 6.3 names both halves. `-m` is an
        # expression over MARKERS rather than paths, so moving either module cannot drop
        # it from the job that exists to run it.
        run: python -m pytest -m 'mandatory and (oidc or cerbos)' --report-log=auth.jsonl -q
      - name: The mandatory selection recorded zero skips
        run: python scripts/check-no-skips.py backend/auth.jsonl
      - name: Authentik logs on failure
        if: failure()
        run: docker logs forgeops-ci-authentik-server 2>&1 | tail -n 200
      - name: Cerbos logs on failure
        if: failure()
        run: docker logs forgeops-ci-cerbos 2>&1 | tail -n 100

  # ── 8. frontend: lint → test → build with a non-default browser URL ───────
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint .
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest --run
      # Criterion 6: a non-default browser URL must be inlined at build time.
      - name: Build with a non-default public URL
        env:
          NEXT_PUBLIC_API_BASE_URL: http://ci.example.test:9999/api/v1
          NEXT_PUBLIC_APP_NAME: ForgeOpsCI
        run: pnpm exec next build
      # Criterion 6: a non-default browser URL must be inlined at build time.
      # This step previously ended in `|| true`, so the one check that proves
      # NEXT_PUBLIC_* is baked into the bundle could never fail the job.
      - name: Assert the generated client uses the supplied build URL
        env:
          NEXT_PUBLIC_API_BASE_URL: http://ci.example.test:9999/api/v1
          # The build above always runs first here, so a missing .next is a bug,
          # not a reason to fall back to config-only assertions.
          FORGEOPS_REQUIRE_BUNDLE_CHECK: "1"
        run: bash ../scripts/check-frontend-container.sh

  # ── 8. compose smoke: exactly the five default services, from no .env ─────
  compose-smoke:
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Debt D2 (design §0.5). Phase 0's job ran `docker compose config` and nothing
      # else: it never built either image and never started a container, so
      # criterion 4's own wording and the container half of criterion 1 rested on a
      # developer's local runs. A smoke job that starts nothing cannot gate the four
      # services Phase 1 adds, nor the `e2e` journey that needs them running.
      #
      # The fresh-clone path is asserted first and kept intact throughout: no `.env`
      # is created, so every value comes from the committed `.env.example` defaults
      # baked into docker-compose.yml (design §13.3).
      - name: Assert no committed .env exists (fresh-clone path)
        run: test ! -e .env
      - name: Assert the unprofiled service set is exactly the committed set
        run: |
          expected="$(grep -v '^#' scripts/compose-default-services.txt | grep -v '^$' | sort | tr '\n' ' ')"
          got="$(docker compose config --services | sort | tr '\n' ' ')"
          echo "expected: $expected"
          echo "got     : $got"
          test "$got" = "$expected"
      - name: Assert optional profiles stay out of the default set
        run: |
          docker compose config --services | grep -qx infisical && exit 1 || true
          docker compose config --services | grep -qx agent-dev && exit 1 || true
          docker compose --profile vault config --services | grep -qx infisical
          docker compose --profile tools config --services | grep -qx agent-dev
      # D2's substance: build both images and start the stack for real.
      - name: Build the backend and frontend images
        run: docker compose build backend frontend
      - name: Start the default stack and wait for health
        run: docker compose up -d --wait --wait-timeout 300
      - name: Assert every default service is healthy, not merely running
        run: bash scripts/check-compose-healthy.sh
      - name: Assert the backend answers liveness and readiness from the container
        run: |
          # /health is dependency-free; /health/ready proves Postgres and Redis are
          # genuinely reachable from inside the compose network, which is the part a
          # `config`-only job could never show.
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:8000/health
          echo
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:8000/health/ready
          echo
      - name: Assert the frontend serves its shell from the built image
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors -o /dev/null -w '%{http_code}\n' http://127.0.0.1:3000/
      # Debt D5's OPA clause, as corrected by D-51. The clause asked for a
      # `1.4.2-rootless` tag that OPA 1.x does not publish, and a tag-name suffix was
      # never evidence of a runtime user anyway: a `-rootless` image handed `user: root`
      # in Compose would have satisfied it. `check-compose-validate.py` now rejects a
      # root `user:` override statically; this is the other half, read out of the host
      # process table of the container that is actually running.
      - name: Assert the OPA container does not run as root
        run: bash scripts/check-container-nonroot.sh opa
      # Optional-profile evidence. Each command lands with the task that owns the
      # service it starts, so this job never waits on a container that does not exist:
      #   - `vault` (infisical): task 10.4
      #   - `auth`  (authentik): task 6.3
      # `tools` (agent-dev) is a build-only devtools image with no long-running
      # process, so it is asserted by the profile selection above rather than started.
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear the stack down
        if: always()
        run: docker compose down -v --remove-orphans

  # ── 9. audit: dependency vulnerability gates ──────────────────────────────
  audit:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
      # Debt D4 (design §0.5). Every tool that gates this job is now itself pinned.
      # `go run` from agent/tools resolves both tools through that module's committed
      # go.sum, so the scanner's own bytes are checksum-verified. Phase 0 installed
      # govulncheck from a floating version: the gate that proves the dependency set is safe
      # was the one dependency verified against nothing.
      - name: No floating tool versions anywhere
        run: bash scripts/check-no-latest.sh
      # The secret scan's allowlist is the one control that can silently disable the
      # scan itself, so it is checked in the same job that owns the other gates.
      - name: The gitleaks allowlist must stay narrow
        run: bash scripts/check-gitleaks-config.sh
      - name: go mod verify + govulncheck (pinned v1.1.4 via agent/tools)
        run: |
          cd agent && go mod verify && cd ..
          bash scripts/check-govulncheck.sh
      - name: pip-audit (hash-pinned via requirements-tools.lock)
        working-directory: backend
        run: |
          pip install --require-hashes -r ../scripts/requirements-tools.lock
          pip-audit -r requirements.lock --strict || pip-audit -r requirements.lock
      # `|| true` removed. This step previously reported a finding and then exited 0,
      # so the frontend advisory gate was decorative — and Phase 1 adds ~6 frontend
      # dependencies, so it is the surface growing fastest.
      - name: pnpm audit (gating at high)
        working-directory: frontend
        run: pnpm audit --audit-level high

  # ── 10. supply: validate the release config on every PR (no publish) ──────
  supply:
    needs: changes
    if: needs.changes.outputs.agent == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum
      # Criterion 7: six CGO_ENABLED=0 targets must build from the release config.
      #
      # GITHUB_TOKEN is required: the action resolves its version and downloads
      # the GoReleaser release over the network, and without a token those
      # lookups are unauthenticated and get rate-limited on shared runners. The
      # step then dies in under a second with an empty log. release.yml already
      # sets the token, which is why the equivalent step there passes.
      #
      # The version is pinned to the exact release that the v0.0.1-rc3 release
      # run (30469955653) used — "Downloading .../download/v2.17.1/
      # goreleaser_Linux_x86_64.tar.gz" — so the floating "~> v2" constraint no
      # longer has to be resolved and the snapshot gate is reproducible.
      - name: GoReleaser snapshot (validates the release config, publishes nothing)
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          distribution: goreleaser
          version: "v2.17.1"
          args: release --snapshot --clean
          workdir: agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert six target binaries were produced
        working-directory: agent
        run: |
          count="$(find dist -type f -name 'forgeops-agent*' \( -perm -u+x -o -name '*.exe' \) | wc -l)"
          echo "binaries: $count"
          test "$count" -ge 6
