name: Templates Library Validation Pipeline

on:
  workflow_dispatch:
  push:
    branches: [phase-1-implementation, main]
  pull_request:
    branches: [main]

jobs:
  validate-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install pytest pydantic pyyaml

      - name: Validate Default Template Library
        run: |
          cd backend
          pytest tests/unit/test_template_library.py -v
