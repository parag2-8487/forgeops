name: Templates Library Validation Pipeline

on:
  workflow_dispatch:
  push:
    branches: [phase-1-implementation, main]
  pull_request:
    branches: [main]

jobs:
  validate-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install pytest pydantic pyyaml

      - name: Validate Default Template Library
        run: |
          cd backend
          pytest tests/unit/test_template_library.py -v
