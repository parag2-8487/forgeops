name: Templates Library Validation Pipeline

# This job had never passed. Two independent faults, both fixed here:
#
#   1. It pinned Python 3.11 while `backend/pyproject.toml` declares
#      `requires-python = ">=3.13,<3.14"`.
#   2. It installed `pytest pydantic pyyaml` and nothing else, so pytest aborted before collecting
#      anything: `backend/pyproject.toml` puts `--cov=src --cov-branch --cov-fail-under=70` in
#      `addopts`, and without `pytest-cov` those are unrecognised arguments. The job failed in about
#      eleven seconds with exit code 4, which is an argument error rather than a test failure — the
#      templates were never actually validated by it.
#
# Both are fixed the same way the rest of CI already works: the pinned version from `ci.yml`, and the
# hash-enforced dev lock rather than an ad-hoc `pip install` list that drifts from what the code needs.

on:
  workflow_dispatch:
  push:
    branches: [phase-1-implementation, main]
  pull_request:
    branches: [main]

env:
  # Kept equal to ci.yml's PYTHON_VERSION on purpose. A second version here is a second thing to
  # forget, and the mismatch is what made this job fail against `requires-python`.
  PYTHON_VERSION: "3.13"

jobs:
  validate-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The same hash-enforced lock every other Python job uses. An ad-hoc package list cannot
      # express what the import chain needs and silently rots when the code gains a dependency.
      - name: Install dev lock with hash enforcement
        working-directory: backend
        run: pip install --require-hashes -r requirements-dev.lock

      # `--no-cov` because the coverage gate belongs to the `backend` job, which runs the whole
      # suite. This job runs ONE file, and one file cannot cover 70 % of `src` — `addopts` documents
      # that consequence itself. The gate is not weakened; it is enforced where it can be met.
      - name: Validate the default template library
        working-directory: backend
        run: python -m pytest tests/unit/test_template_library.py -v --no-cov
