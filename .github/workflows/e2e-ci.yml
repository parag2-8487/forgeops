# Renamed 2026-08-21. This was "End-to-End Release Journey CI" with a job called `e2e-journey`,
# and it runs neither: six steps that install Node, build the FRONTEND ONLY, and execute a
# 20-line spec asserting a page title, a visible h1 and one string. No backend image, no agent
# container, no fixture project, no on-disk assertion, no revert, no artifact upload.
#
# The old name was the load-bearing part of a false record: criterion 10 cited this workflow as
# evidence of a 13-step journey, and the name was plausible enough that nobody opened it. Renamed
# to what it does, per D-94, which also descopes the criterion and defers the real journey to the
# phase that has a generation endpoint and a mountable approval surface. See design §12.6 for the
# 13 steps and LEARNING-JOURNAL finding 81 for why naming is not implementation.
name: Frontend Shell Smoke CI

on:
  workflow_dispatch:
  push:
    branches: [phase-1-implementation, main]
  pull_request:
    branches: [main]

jobs:
  shell-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: "11.17.0"

      - name: Install dependencies
        run: |
          cd frontend
          pnpm install

      - name: Install Playwright Browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Build frontend
        run: |
          cd frontend
          pnpm build

      - name: Run the shell smoke spec
        run: |
          cd frontend
          npx playwright test e2e/journey.spec.ts
