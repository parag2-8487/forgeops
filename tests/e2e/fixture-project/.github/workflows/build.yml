---
name: build

# `on` is quoted because YAML 1.1 reads a bare `on` as the boolean true. Unquoted it still works in
# GitHub Actions, but every linter reports it, so the generated file avoids the argument.
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are referenced by tag rather than by commit SHA. Pin these to SHAs for a production
      # pipeline: a tag is mutable, so what runs here can change without this file changing.
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: onboarding-mti15hj6:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
