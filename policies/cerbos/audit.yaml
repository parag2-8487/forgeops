# `audit` — §11.2's matrix row.
#
#   admin      read
#   developer  read (own project)
#   viewer     read (own project)
#
# Read-only for everyone, with no write verb defined at all — not even for admin. §1.9's
# guarantee is that the log is append-only and hash-chained, and `0007` enforces it in the
# database by REVOKing UPDATE, DELETE and TRUNCATE from the application role. Defining an
# `update` action here, even denied, would imply the API has a path to take; it has none.
#
# The "own project" qualifier is the `member` derived role. An admin reads everything,
# which is what makes the audit log usable during an investigation that spans projects.
---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: audit
  importDerivedRoles:
    - forgeops_common
  rules:
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["admin"]

    # Developers and viewers read only the projects they belong to or own. A developer who
    # is not a member gets the same 403 body as one asking about a project that does not
    # exist (§4.2), so the audit log cannot be used to enumerate projects.
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["owner", "member"]
