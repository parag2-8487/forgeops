# `secret` — §11.2's matrix row, and the one rule that admits no exception.
#
#   admin      create, read_metadata, update, delete
#   developer  create, read_metadata, update
#   viewer     read_metadata
#
# **No role can read a secret value through the API — not even admin.** §11.2 is explicit
# about why: the value exists to be injected at deploy time, and a "reveal" endpoint would
# turn the vault into a distribution channel. Q-20 asserts this half, and the mutation row
# for Q-20 is "add `read_value` to the viewer's policy" — so the deny below is the thing
# that property is pointed at.
#
# Spelling: §11.2 writes `read-metadata`; the action here is `read_metadata`. Underscores,
# because `read_value` appears in the same section and in Q-20's mutation row with an
# underscore, and one resource with two separators is a typo waiting to be authorised.
---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: secret
  rules:
    - actions: ["create", "read_metadata", "update", "delete"]
      effect: EFFECT_ALLOW
      roles: ["admin"]

    - actions: ["create", "read_metadata", "update"]
      effect: EFFECT_ALLOW
      roles: ["developer"]

    - actions: ["read_metadata"]
      effect: EFFECT_ALLOW
      roles: ["viewer"]

    # The rule with no exceptions. Listed for all three roles explicitly rather than
    # relying on deny-by-default, because deny-by-default is silent: a later commit adding
    # `read_value` to an allow list would simply start working. This makes that commit
    # produce a policy that contradicts itself, which is a review conversation.
    - actions: ["read_value"]
      effect: EFFECT_DENY
      roles: ["admin", "developer", "viewer"]

    - actions: ["delete"]
      effect: EFFECT_DENY
      roles: ["developer", "viewer"]

    - actions: ["create", "update"]
      effect: EFFECT_DENY
      roles: ["viewer"]
