# SPDX-License-Identifier: FSL-1.1-ALv2
#
# Negative controls for every correctness property (design.md §0.4.5, Appendix B).
#
# WHY THIS FILE EXISTS
# `REVIEW-PHASE-0.md` Pass 8 emptied BOTH of P-09's redaction pattern lists and all
# thirteen of its tests stayed green. The clause was decorative and nothing in CI
# could tell. Every property in Phase 1 therefore ships with the specific mutation
# that must make it fail, and `scripts/mutation-harness.py` runs them as a CI job.
# A property that survives its own control is reported VACUOUS and fails the build.
#
# SCHEMA
#   runtime     "python" (default) or "go"
#   property    path to the property test file, from the repository root
#   target      dotted path (python) or symbol (go) being mutated - documentation
#   mutation    the control EXACTLY as Appendix B words it, so a reviewer can
#               compare the two without reading code
#   description why that mutation must break the property
#   patch       [python] statements that install the mutation, executed by a
#               generated pytest plugin in a temp dir OUTSIDE the repository
#   original    [go] the tracked file the overlay replaces
#   overlay     [go] the replacement file, applied via `go build -overlay`
#   package     [go] package pattern to test
#   test_run    [go] -run regex
#
# Both `mutation` and `patch` are required for a python row. A prose-only control is
# precisely what made P-09 look tested.
#
# GROWTH
# This file gains exactly one row per property leaf, and the harness checks it
# against Appendix B's table read out of design.md - not against a list restated
# here, so the two cannot drift. Until every property has landed, the `mutation` CI
# job passes `--allow-incomplete`; task 19.2 removes that flag, at which point all
# thirty-one rows must exist. `--allow-incomplete` never suppresses a VACUOUS row
# or a dirty working tree.
#
# CURRENT STATE
# One `Q-` row: Q-27, landed with task 2.2. The remaining thirty arrive with their own
# property leaves. The harness's own behaviour - that it reports VACUOUS, that its temp
# directory is outside the tree, and that it leaves `git status --porcelain` empty - is
# proven by `backend/tests/meta/test_mutation_harness.py` against fixture manifests.

[Q-27]
runtime     = "python"
property    = "backend/tests/property/test_q27_tier_provenance.py"
target      = "src.main.load_tier_config"
mutation    = "Hard-code the tier map in the lifespan and ignore the path"
description = """
Freezes the tier configuration at whatever the committed config/model-tiers.yaml says
and returns it for every path, which is precisely the Phase 0 state debt D1 describes:
the shipped YAML is not what a running backend loads. Q-27 quantifies over GENERATED
documents, so no fixed map can agree with them and the property must fail.
"""
patch = """
import os
from pathlib import Path

import src.main as main_module
from src.ai.routing.tiers import load_tier_config as _real_load_tier_config

_committed = Path(main_module.__file__).resolve().parent.parent / "config" / "model-tiers.yaml"
_frozen = _real_load_tier_config(_committed, env=os.environ)


def _ignores_the_configured_path(path, env=None):
    return _frozen


main_module.load_tier_config = _ignores_the_configured_path
"""

[Q-19]
runtime     = "python"
property    = "backend/tests/property/test_q19_route_coverage.py"
target      = "src.main.create_app route dependencies"
mutation    = "Drop the `require_principal` dependency from `GET /api/v1/projects` without adding that path to `PUBLIC_ROUTES`"
description = """
Removes the per-route auth dependency from one protected route while leaving the public
allowlist alone, which is exactly the drift deny-by-default exists to prevent: the route
still looks protected in the router listing and answers whatever its handler returns.
Q-19 must then fail twice over — structurally, because the route is classified protected
and carries no auth dependency; and behaviourally, because an unauthenticated request no
longer gets 401 and the handler body executes.

Appendix B names `GET /api/v1/projects`, which task 11.3 adds. Until it exists the patch
targets the first `app`-family protected route the real router serves, and asserts it
stripped exactly one — so the control can never quietly become a no-op, and it starts
hitting the path Appendix B names as soon as that path exists. Wording left as Appendix B
words it so the two can be compared without reading code.
"""
patch = """
import src.main as main_module

_real_create_app = main_module.create_app

#: Appendix B's route first; otherwise whichever protected route the router does serve.
_PREFERRED = "/api/v1/projects"


def _strip_one_auth_dependency():
    from src.auth.dependencies import AUTH_DEPENDENCY_QUALNAMES, route_requires_principal

    app = _real_create_app()

    def _names(dependant):
        call = getattr(dependant, "call", None)
        return {
            getattr(call, "__qualname__", "") or getattr(call, "__name__", ""),
            f"{getattr(call, '__module__', '')}.{getattr(call, '__qualname__', '')}",
        }

    def _guards(dependant):
        for name in _names(dependant):
            for accepted in AUTH_DEPENDENCY_QUALNAMES:
                if name == accepted or name.endswith("." + accepted):
                    return True
        return False

    def _flatten(routes, prefix=""):
        for route in routes:
            included = getattr(route, "original_router", None)
            if included is not None:
                context = getattr(route, "include_context", None)
                yield from _flatten(getattr(included, "routes", []), prefix + (getattr(context, "prefix", "") or ""))
                continue
            yield prefix, route

    candidates = []
    for prefix, route in _flatten(app.routes):
        raw_path = getattr(route, "path", None)
        methods = getattr(route, "methods", None)
        dependant = getattr(route, "dependant", None)
        if raw_path is None or methods is None or dependant is None:
            continue
        path = prefix + raw_path
        if not route_requires_principal(path, set(methods)):
            continue
        # `app` family only: the MCP surface keeps Phase 0's contract (design 4.4), and
        # stripping its dependency would exercise a different clause.
        if any("require_mcp_principal" in name for child in dependant.dependencies for name in _names(child)):
            continue
        if any(_guards(child) for child in dependant.dependencies):
            candidates.append((path, dependant))

    assert candidates, "the mutation found no protected route to strip; the control would be a no-op"
    chosen = next((entry for entry in candidates if entry[0] == _PREFERRED), candidates[0])
    path, dependant = chosen
    before = len(dependant.dependencies)
    dependant.dependencies = [child for child in dependant.dependencies if not _guards(child)]
    assert len(dependant.dependencies) < before, f"nothing was stripped from {path}"
    return app


main_module.create_app = _strip_one_auth_dependency
"""
