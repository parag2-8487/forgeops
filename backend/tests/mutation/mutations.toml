[Q-17]
runtime     = "python"
property    = "backend/tests/property/test_q17_pairing_code_safety.py"
target      = "src.auth.devices.CONSUME_SCRIPT"
mutation    = "Make the consume script non-atomic (read then delete)"
description = """
Splits the single `EVAL` into a read followed by a separate delete, which is what the docstring
above `CONSUME_SCRIPT` says must never happen. Redis executes one script to completion before the
next command on that key, so of N concurrent attempts on one code exactly one can observe the key
and delete it. Two round trips lose that: two callers can both read the key before either deletes
it, and both are issued credentials for one pairing code.

The mutation is delivered as a script that returns the fields WITHOUT deleting, plus an
application-level delete after the read — so the window is real rather than simulated, and the
timing is the operating system's rather than the test's.

`test_q17_pairing_code_safety.py::test_over_generated_concurrency` must then fail. It generates the
NUMBER of concurrent attempts between two and eight, because a read-then-delete pair is atomic
*enough* at two attempts on a fast machine and visibly wrong at eight — a fixed concurrency of two
is a coin toss against this mutation, and the generated count is not. It asserts the count of
SUCCESSES equals one, so "everything failed" cannot pass, and then reads the database: exactly one
device row is `active` and its `pairing_token_hmac` is `NULL`, which is Appendix A.1's "the code
cannot be reused, even in the DB".

Leaf 8.1's `::test_concurrent_attempts_yield_at_most_one_success` objects too, at its fixed
concurrency of six. Both are in scope; the property is what makes the clause hold at every
concurrency rather than at one.
"""
patch = """
import src.auth.devices as devices_module

#: The read half only. `HMGET` and the attempt counter stay, so every non-concurrent test still
#: passes and the ONLY behaviour that changes is the serialisation point.
_NON_ATOMIC_READ = \"\"\"
local key = KEYS[1]
local max_attempts = tonumber(ARGV[1])
if redis.call('EXISTS', key) == 0 then
    return {'missing'}
end
local attempts = tonumber(redis.call('HINCRBY', key, 'attempts', 1))
if attempts > max_attempts then
    redis.call('DEL', key)
    return {'burned'}
end
local fields = redis.call('HMGET', key, 'project', 'tenant', 'issuer', 'device')
return {'ok', fields[1], fields[2], fields[3], fields[4], tostring(attempts)}
\"\"\"

_real_eval = None

devices_module.CONSUME_SCRIPT = _NON_ATOMIC_READ

_real_exchange = devices_module.DeviceService.exchange


async def _exchange_then_delete(self, session, *, code, csr_pem, meta, client_ip):
    digest = self._pairing_digest(code)
    key = devices_module.PAIRING_KEY_PREFIX + digest.hex()
    try:
        return await _real_exchange(self, session, code=code, csr_pem=csr_pem, meta=meta, client_ip=client_ip)
    finally:
        # The delete the script no longer performs, moved into the application: the window between
        # the read and this line is the mutation.
        await self._redis.delete(key)


devices_module.DeviceService.exchange = _exchange_then_delete

assert \"DEL\" not in devices_module.CONSUME_SCRIPT.split(\"HMGET\")[-1], (
    \"the consume script still deletes the key inside the EVAL; the control would be a no-op\"
)
"""

