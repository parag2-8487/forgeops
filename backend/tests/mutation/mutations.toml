mutation    = "Drop the prompt from the canonical key payload, so the key no longer depends on it"
description = """
Appendix B's control is "widen `lookup`/`store` back to `str`". Widening a type annotation
changes nothing at runtime -- Python does not enforce `NewType` -- so on its own it cannot make
any assertion fail. This row mutates what widening the type would COST: the key stops being
computed over the prompt at all, keyed on model and params only.

Two independent clauses die, which is what makes this a strong control rather than a lucky one.
`test_a_cached_completion_is_not_retrievable_with_unredacted_text` fails because the redacted
prompt and the raw text now produce the same digest, so the unredacted lookup hits -- exactly
the leak the `RedactedPrompt` type exists to prevent. And
`test_distinct_prompts_do_not_share_a_cache_entry` fails because every prompt for a given model
collides, so one caller reads another's completion.

The property file was rewritten in the same commit as this row and the reason is recorded there:
the previous version imported only `hashlib`, hashed a value twice and asserted the digests were
equal, so it exercised no production code and no mutation of the cache could ever have been
detected.
"""
patch = """
import hashlib
import json

from src.ai.routing import cache as cache_module


def _key_without_the_prompt(self, model, prompt, params):
    # The prompt is gone from the canonical payload.
    canonical = json.dumps(
        {"model": model, "params": params or {}},
        sort_keys=True,
        separators=(",", ":"),
    )
    return hashlib.sha256(canonical.encode("utf-8")).hexdigest()


cache_module.TieredSemanticCache._build_key = _key_without_the_prompt
"""
