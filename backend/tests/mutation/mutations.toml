patch = """
import src.websocket.hub as hub_module

# THE GUARD IS LOAD-BEARING. pytest can import a `-p` plugin more than once in a session, and a
# second import used to re-read `AgentHub._live` -- by then already `_once_per_connection` -- and wrap
# the wrapper. `_real_live` then pointed at itself, so the first frame recursed until Python raised
# RecursionError, which is an `Exception`, which `_live`'s own fail-closed handler caught, which
# called `self._reject` on a duck-typed probe that has no such attribute. The visible result was
#
#     INTERNALERROR> AttributeError: 'types.SimpleNamespace' object has no attribute '_reject'
#
# and pytest exited 3. The harness read any non-zero exit as "the property failed", so this control
# was recorded as a kill while the property had never run at all.
if not getattr(hub_module.AgentHub._live, "_q16_mutation_installed", False):
    _real_live = hub_module.AgentHub._live
    _answered: dict[tuple[int, str], bool] = {}

    async def _once_per_connection(self, ws, device_id):
        key = (id(ws), str(device_id))
        if key not in _answered:
            _answered[key] = await _real_live(self, ws, device_id)
        return _answered[key]

    _once_per_connection._q16_mutation_installed = True
    hub_module.AgentHub._live = _once_per_connection

# The mutation must be OBSERVABLE before the property runs, or the control proves nothing. A
# duck-typed self is enough: `_live` reads `self._deps.devices.is_revoked` and, for an unrevoked
# device, returns True without touching the socket.
#
# A LIST rather than a module global, and that is the whole reason this control never worked. The
# harness indents every patch into `def pytest_sessionstart(session):`, so this body runs inside a
# function: `_calls = 0` was a local, `global _calls` in the probe bound to a module attribute nothing
# created, and `_calls += 1` raised NameError. That happened inside `_live`'s `try`, whose fail-closed
# handler catches any Exception and calls `self._reject` -- which a SimpleNamespace does not have. So
# the visible failure was
#
#     INTERNALERROR> AttributeError: 'types.SimpleNamespace' object has no attribute '_reject'
#
# pytest exited 3, no test ran, and the old harness counted the non-zero exit as a kill. Appending to
# a list captured by closure needs no declaration and cannot fail this way.
import asyncio  # noqa: E402
from types import SimpleNamespace  # noqa: E402

_calls = []


async def _is_revoked(device_id):
    _calls.append(device_id)
    return False


_probe = SimpleNamespace(_deps=SimpleNamespace(devices=SimpleNamespace(is_revoked=_is_revoked)))
_socket = object()


async def _observe():
    await hub_module.AgentHub._live(_probe, _socket, "11111111-1111-4111-8111-111111111111")
    await hub_module.AgentHub._live(_probe, _socket, "11111111-1111-4111-8111-111111111111")


asyncio.run(_observe())
assert len(_calls) == 1, (
    f"the underlying revocation check ran {len(_calls)} times for two frames; the cache did not "
    "install and the control would be a no-op"
)
"""

