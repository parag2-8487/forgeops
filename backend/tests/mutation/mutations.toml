[Q-03]
runtime     = "python"
property    = "backend/tests/property/test_q03_chokepoint_unbypassable.py"
target      = "src.governance.authority.MutationAuthority.__post_init__"
mutation    = "Delete the `_MINT_SENTINEL` check in `__post_init__`"
description = """
Removes the identity comparison that makes `MutationAuthority` unforgeable, so any caller
anywhere can construct one and every mutation primitive's capability argument becomes a
formality. This is §2.2.1 mechanism 1 switched off, and it is the mechanism the other two
rest on: the banned-api rule exists to stop the sentinel being NAMED, and the reachability
check accepts a call that "receives a MutationAuthority" — both are worthless if anybody can
produce one.

Q-03's clause B quantifies construction over every value hypothesis can produce — None,
booleans, integers, text, bytes, a fresh `object()`, containers — so no single replacement
sentinel can satisfy it and the property must fail on the first generated example.

The patch replaces `__post_init__` with a no-op rather than editing the tracked file, and
asserts the mutation is OBSERVABLE before the property runs: it constructs an authority with
a plain `object()` sentinel, which the real class refuses. A control that installed itself
and changed nothing would report the property healthy, which is what this whole file exists
to prevent.
"""
patch = """
import uuid

import src.governance.authority as authority_module


def _no_sentinel_check(self, _sentinel):
    return None


authority_module.MutationAuthority.__post_init__ = _no_sentinel_check

# The mutation must be observable, or the control proves nothing.
_forged = authority_module.MutationAuthority(
    change_set_id=uuid.uuid4(),
    approval_id=uuid.uuid4(),
    policy_bundle_digest="sha256:" + "00" * 32,
    blast_radius="infrastructure",
    audit_seq=1,
    envelope_digest="d" * 64,
    _sentinel=object(),
)
assert _forged.blast_radius == "infrastructure", (
    "the mutation did not take effect; MutationAuthority still refuses a foreign sentinel and "
    "the control would be a no-op"
)
"""

[Q-04]
runtime     = "python"
property    = "backend/tests/property/test_q04_audit_completeness.py"
target      = "src.audit.writer.AuditWriter.append"
mutation    = "Move the audit write outside the transaction"
description = """
Makes `append` COMMIT as soon as it has written its record, instead of leaving the commit to
the caller. That is the arrangement §11.9 exists to forbid: the audit row stops being atomic
with the change-set state transition, so a transit that aborts after auditing leaves a record
describing a state change that never happened, and a rolled-back transaction leaves the record
behind.

Q-04 must then fail on its rollback clause — the record and the state change both survive a
`session.rollback()` the property requires to leave neither.

Why committing rather than opening a second connection. The first version of this control built
a detached `AsyncSession` from `session.get_bind()`, which returns the SYNC engine, so it raised
`ArgumentError` and the property "failed" for a reason that had nothing to do with the mutation
— a control that is broken rather than a control that bites. Committing early is the minimal
edit that produces exactly the semantics Appendix B words: after `append` returns, the row is
outside the caller's transaction and the caller can no longer undo it.

Everything else about `append` is preserved: the chain arithmetic, the advisory lock, the flush
that assigns `seq`.
"""
patch = """
import src.audit.writer as writer_module

_real_append = writer_module.AuditWriter.append


async def _append_and_commit_immediately(self, session, draft):
    event = await _real_append(self, session, draft)
    # The mutation: the record leaves the caller's transaction here, so a later rollback in the
    # caller cannot remove it and a failed state change no longer un-writes its audit row.
    await session.commit()
    return event


writer_module.AuditWriter.append = _append_and_commit_immediately

assert writer_module.AuditWriter.append is _append_and_commit_immediately, (
    "the mutation did not install; the control would be a no-op"
)
assert writer_module.AuditWriter.append is not _real_append
"""

[Q-05]
runtime     = "python"
property    = "backend/tests/property/test_q05_audit_immutability.py"
target      = "src.audit.writer.AuditWriter.append + verify_chain hashing"
mutation    = "Drop `prev_hash` from the hashed payload"
description = """
Removes the `|| prev_hash` concatenation from the digest on BOTH sides — the writer and the
verifier — so each row's hash covers only its own semantic fields. The rows keep their
`prev_hash` column and the chain still looks like a chain, but nothing links a row's hash to
its predecessor (§6.4, A.8).

Both sides are mutated together, and that is the point rather than a convenience. Mutating only
the writer would make every row fail verification immediately, which is a *different* failure —
"the writer and verifier disagree" — and would let the control pass for a property that never
checked linkage at all. Mutating both leaves a self-consistent non-chain, which is exactly the
artifact Appendix B's control describes.

WHICH CLAUSE THIS BREAKS, and why the obvious answer is wrong. It does **not** break the
`prev_hash` clause: D-61 added an explicit comparison of each row's stored `prev_hash` against
its predecessor's `hash`, and that catches a rewritten column whatever the digest covers. The
first version of Q-05 therefore PASSED under this control — observed directly — because every
clause it had was still satisfied.

What the concatenation is the only defence against is a **splice**: delete a middle row and
re-link the next one to the row before it. Afterwards every `prev_hash` really does equal its
new predecessor's `hash`, so the column comparison agrees; the sole remaining objection is that
the surviving row's own hash was computed over `payload || hash(the row that is now gone)`.
`TestASplicedChainIsDetected` is that clause, and it is the one that fails here — with
`kind == "hash"`, not `"prev_hash"`, which is itself the evidence that the two comparisons are
distinguishable.

The patch asserts its own observability in both directions: a chain digest drops its 32-byte
prev term, and a lock-key digest does not — because `_lock_key` also calls `sha256` and silently
mutating the advisory lock would make the run fail for a reason Appendix B does not describe.
"""
patch = """
import hashlib

import src.audit.writer as writer_module

_real_canonical_bytes = writer_module.canonical_bytes

# Prove the concatenation matters before removing it, or this control could install itself over
# an implementation that never used prev_hash and still report the property healthy.
_probe = _real_canonical_bytes({"a": 1})
assert hashlib.sha256(_probe + bytes(32)).digest() != hashlib.sha256(_probe).digest()


def _is_a_chain_digest(data):
    # The discriminator, and it has to be precise. `append` and `verify_chain` both compute
    # sha256(canonical_bytes(payload) + prev), where the payload is a JSON object and `prev` is
    # exactly 32 bytes. `_lock_key` ALSO calls sha256, on a tenant UUID string or the configured
    # lock name — 36 and 14 bytes, never starting with `{`. Stripping a 32-byte suffix from those
    # would change the advisory lock as well, which is a side effect Appendix B's control does not
    # describe and would make the mutated run fail for the wrong reason.
    return isinstance(data, bytes | bytearray) and len(data) > 32 and bytes(data[:1]) == b"{"


class _PayloadOnlyDigest:
    \"\"\"sha256 over the canonical payload alone, with the concatenated prev term dropped.\"\"\"

    __slots__ = ("_payload",)

    def __init__(self, payload):
        self._payload = payload

    def digest(self):
        return hashlib.sha256(self._payload).digest()

    def hexdigest(self):
        return hashlib.sha256(self._payload).hexdigest()


class _PatchedHashlib:
    \"\"\"`hashlib`, except that a chain digest ignores its prev term. Everything else is real.\"\"\"

    def __getattr__(self, name):
        return getattr(hashlib, name)

    @staticmethod
    def sha256(data=b""):
        if _is_a_chain_digest(data):
            return _PayloadOnlyDigest(bytes(data[:-32]))
        return hashlib.sha256(data)


writer_module.hashlib = _PatchedHashlib()

# Observability, both directions: a chain digest drops its suffix, and a lock key does not.
_chain = _real_canonical_bytes({"reason": "x"}) + bytes(32)
assert writer_module.hashlib.sha256(_chain).digest() == hashlib.sha256(_chain[:-32]).digest(), (
    "the mutation did not install; the control would be a no-op"
)
_lock_input = b"00000000-0000-4000-8000-000000000000"
assert writer_module.hashlib.sha256(_lock_input).digest() == hashlib.sha256(_lock_input).digest(), (
    "the mutation leaked into the advisory lock key, which Appendix B's control does not describe"
)
"""

[Q-19]
runtime     = "python"
property    = "backend/tests/property/test_q19_route_coverage.py"
target      = "src.main.create_app route dependencies"
mutation    = "Drop the `require_principal` dependency from `GET /api/v1/projects` without adding that path to `PUBLIC_ROUTES`"
description = """
Removes the per-route auth dependency from one protected route while leaving the public
allowlist alone, which is exactly the drift deny-by-default exists to prevent: the route
still looks protected in the router listing and answers whatever its handler returns.
Q-19 must then fail twice over — structurally, because the route is classified protected
and carries no auth dependency; and behaviourally, because an unauthenticated request no
longer gets 401 and the handler body executes.

Appendix B names `GET /api/v1/projects`, which task 11.3 adds. Until it exists the patch
targets the first `app`-family protected route the real router serves, and asserts it
stripped exactly one — so the control can never quietly become a no-op, and it starts
hitting the path Appendix B names as soon as that path exists. Wording left as Appendix B
words it so the two can be compared without reading code.
"""
patch = """
import src.main as main_module

_real_create_app = main_module.create_app

#: Appendix B's route first; otherwise whichever protected route the router does serve.
_PREFERRED = "/api/v1/projects"


def _strip_one_auth_dependency():
    from src.auth.dependencies import AUTH_DEPENDENCY_QUALNAMES, route_requires_principal

    app = _real_create_app()

    def _names(dependant):
        call = getattr(dependant, "call", None)
        return {
            getattr(call, "__qualname__", "") or getattr(call, "__name__", ""),
            f"{getattr(call, '__module__', '')}.{getattr(call, '__qualname__', '')}",
        }

    def _guards(dependant):
        for name in _names(dependant):
            for accepted in AUTH_DEPENDENCY_QUALNAMES:
                if name == accepted or name.endswith("." + accepted):
                    return True
        return False

    def _flatten(routes, prefix=""):
        for route in routes:
            included = getattr(route, "original_router", None)
            if included is not None:
                context = getattr(route, "include_context", None)
                yield from _flatten(getattr(included, "routes", []), prefix + (getattr(context, "prefix", "") or ""))
                continue
            yield prefix, route

    candidates = []
    for prefix, route in _flatten(app.routes):
        raw_path = getattr(route, "path", None)
        methods = getattr(route, "methods", None)
        dependant = getattr(route, "dependant", None)
        if raw_path is None or methods is None or dependant is None:
            continue
        path = prefix + raw_path
        if not route_requires_principal(path, set(methods)):
            continue
        # `app` family only: the MCP surface keeps Phase 0's contract (design 4.4), and
        # stripping its dependency would exercise a different clause.
        if any("require_mcp_principal" in name for child in dependant.dependencies for name in _names(child)):
            continue
        if any(_guards(child) for child in dependant.dependencies):
            candidates.append((path, dependant))

    assert candidates, "the mutation found no protected route to strip; the control would be a no-op"
    chosen = next((entry for entry in candidates if entry[0] == _PREFERRED), candidates[0])
    path, dependant = chosen
    before = len(dependant.dependencies)
    dependant.dependencies = [child for child in dependant.dependencies if not _guards(child)]
    assert len(dependant.dependencies) < before, f"nothing was stripped from {path}"
    return app


main_module.create_app = _strip_one_auth_dependency
"""

[Q-20]
runtime     = "python"
property    = "backend/tests/property/test_q20_rbac_confinement.py"
target      = "policies/cerbos/secret.yaml (viewer rules)"
mutation    = "Add `read_value` to the viewer's Cerbos policy"
description = """
Grants the viewer the one permission §11.2 says no role may have, and removes the viewer
from the blanket `read_value` deny so the grant actually takes effect. Q-20 must then fail
on the clause that says NO role can read a secret value — asked of the real sidecar, so a
policy edit is what the property is reading rather than a Python reimplementation of it.

The tracked policy set is never touched. The mutation writes a COPY into a temp directory
outside the repository and starts a second, digest-pinned Cerbos against it, then points
`FORGEOPS_TEST_CERBOS_URL` at that container for the duration of the run — which is exactly
what §0.4.5's outside-the-tree requirement makes possible. The container is removed on exit,
and the image reference is read out of docker-compose.yml rather than restated so it cannot
drift from the pin the compose checks police.

The patch asserts that both edits actually applied. A control that silently matched nothing
would report the property healthy while mutating an unchanged policy set, which is the
failure mode this whole file exists to prevent.
"""
patch = """
import atexit
import json
import os
import re
import shutil
import subprocess
import tempfile
import time
import urllib.error
import urllib.request
from pathlib import Path

_REPO = Path(__file__).resolve().parent
while not (_REPO / "docker-compose.yml").exists():
    assert _REPO != _REPO.parent, "could not locate the repository root from the plugin"
    _REPO = _REPO.parent

_compose = (_REPO / "docker-compose.yml").read_text(encoding="utf-8")
_image = re.search(r"ghcr\\.io/cerbos/cerbos:[^ \\n]+@sha256:[0-9a-f]{64}", _compose)
assert _image, "no digest-pinned cerbos image found in docker-compose.yml"
_image = _image.group(0)

_tmp = Path(tempfile.mkdtemp(prefix="forgeops-q20-mutation-")).resolve()
assert _REPO.resolve() not in _tmp.parents and _tmp != _REPO.resolve(), _tmp
shutil.copytree(_REPO / "policies" / "cerbos", _tmp / "policies")
shutil.copytree(_REPO / "config" / "cerbos", _tmp / "config")

_secret = _tmp / "policies" / "secret.yaml"
_text = _secret.read_text(encoding="utf-8")

_deny_before = '''    - actions: ["read_value"]
      effect: EFFECT_DENY
      roles: ["admin", "developer", "viewer"]'''
_deny_after = '''    - actions: ["read_value"]
      effect: EFFECT_DENY
      roles: ["admin", "developer"]'''
assert _deny_before in _text, "the blanket read_value deny is not where the control expects it"
_text = _text.replace(_deny_before, _deny_after)

_allow_before = '''    - actions: ["read_metadata"]
      effect: EFFECT_ALLOW
      roles: ["viewer"]'''
_allow_after = '''    - actions: ["read_metadata", "read_value"]
      effect: EFFECT_ALLOW
      roles: ["viewer"]'''
assert _allow_before in _text, "the viewer allow rule is not where the control expects it"
_text = _text.replace(_allow_before, _allow_after)

_secret.write_text(_text, encoding="utf-8")

_name = "forgeops-q20-mutation-cerbos"
subprocess.run(["docker", "rm", "-f", _name], capture_output=True, check=False)
_started = subprocess.run(
    [
        "docker", "run", "-d", "--name", _name,
        "-p", "127.0.0.1:0:3592",
        "-v", f"{_tmp / 'policies'}:/policies:ro",
        "-v", f"{_tmp / 'config'}:/config:ro",
        _image, "server", "--config=/config/cerbos.yaml",
    ],
    capture_output=True, text=True, check=False,
)
assert _started.returncode == 0, f"could not start the mutated Cerbos: {_started.stderr[:400]}"


def _teardown():
    subprocess.run(["docker", "rm", "-f", _name], capture_output=True, check=False)
    shutil.rmtree(_tmp, ignore_errors=True)


atexit.register(_teardown)

_mapped = subprocess.run(
    ["docker", "port", _name, "3592/tcp"], capture_output=True, text=True, check=True
).stdout.splitlines()[0]
_port = _mapped.rsplit(":", 1)[-1].strip()
_url = f"http://127.0.0.1:{_port}"

_deadline = time.time() + 90
while True:
    try:
        with urllib.request.urlopen(f"{_url}/_cerbos/health", timeout=5) as response:
            if response.status == 200:
                break
    except (urllib.error.URLError, OSError):
        pass
    assert time.time() < _deadline, "the mutated Cerbos never became healthy"
    time.sleep(2)

# The mutation must be OBSERVABLE before the property runs. A container serving the
# unmutated set would make this control report a healthy property for the wrong reason.
_probe = json.dumps({
    "requestId": "q20-mutation-probe",
    "principal": {"id": "33333333-3333-3333-3333-333333333333", "roles": ["viewer"], "attr": {}},
    "resources": [{"resource": {"kind": "secret", "id": "probe", "attr": {}}, "actions": ["read_value"]}],
}).encode()
_request = urllib.request.Request(
    f"{_url}/api/check/resources", data=_probe, headers={"Content-Type": "application/json"}
)
with urllib.request.urlopen(_request, timeout=10) as response:
    _answer = json.load(response)
_effect = _answer["results"][0]["actions"]["read_value"]
assert _effect == "EFFECT_ALLOW", f"the mutated policy set did not take effect: read_value={_effect}"

os.environ["FORGEOPS_TEST_CERBOS_URL"] = _url
os.environ["FORGEOPS_REQUIRE_INTEGRATION"] = "1"
"""

[Q-30]
runtime     = "python"
property    = "backend/tests/property/test_q30_blast_radius.py"
target      = "src.auth.principal.blast_radius_for_role"
mutation    = "Read the env var in the gateway when a principal is present"
description = """
Makes an authenticated caller's blast radius the WIDEST of its identity-derived radius and
`MCP_AGENT_BLAST_RADIUS`, which is the Phase 0 behaviour D-39 removed: the authority of a
request becomes a property of the server's configuration rather than of the caller, so
widening it for one caller widens it for all. Q-30 must then fail on both non-widening
clauses — the one that says the derived radius ignores the variable, and the sharp one where
the variable is set wider than the identity permits.

Appendix B words the control as "in the gateway". The patch installs it at
`blast_radius_for_role`, because that is the single function through which an authenticated
caller's radius could actually be widened — `Principal.for_user` has no `blast_radius`
parameter, so there is no other route in. A gateway-only edit would leave every principal's
radius correct and the property would rightly still pass, which would make the control a
no-op rather than a stronger test. Wording left as Appendix B words it so the two can be
compared without reading code.

The patch asserts the env var is set and that the mutated function actually widens, so a
control that installed itself and changed nothing cannot report the property healthy.
"""
patch = """
import os

import src.auth.principal as principal_module

# The variable is a DEV default in D-39's design, so a run that did not set it would make
# this control a no-op. Setting it here is what the mutation is *about*.
os.environ["MCP_AGENT_BLAST_RADIUS"] = "infrastructure"

_real_blast_radius_for_role = principal_module.blast_radius_for_role


def _widened_by_the_environment(role):
    identity = _real_blast_radius_for_role(role)
    from_env = os.environ.get("MCP_AGENT_BLAST_RADIUS", "").strip()
    if from_env not in principal_module.BLAST_RADIUS_ORDER:
        return identity
    return principal_module.widest(identity, from_env)


principal_module.blast_radius_for_role = _widened_by_the_environment

# The mutation must be observable, or the control proves nothing.
from src.auth.models import UserRole  # noqa: E402

assert principal_module.blast_radius_for_role(UserRole.VIEWER) == "infrastructure", (
    "the mutation did not widen a viewer's radius; the control would be a no-op"
)
"""
