mutation    = "Let the loop run one iteration past its bound, as if the counter were never decremented"
description = """
Appendix B's control is "make `_next` return `Continue` without decrementing". The design
sketched the loop as a decrementing state machine with `_next` and `attempts_remaining`;
leaf 13.6 implemented it as a bounded `for` over `range(1, max_iterations + 1)`, so there is
no `_next` to mutate. The mutation is the same defect against the shape that exists: the
bound is off by one, exactly as it would be if a `Continue` were returned without
decrementing, so the loop performs one model call more than `max_iterations` allows.

