one-terminal-event clause Appendix B states**, and closing that gap means extending the test,
not adjusting this mutation.

What the test does constrain is the wire format, and this mutation breaks it in the way that
actually strands a browser: the event/data block is terminated by one newline instead of the
blank line the SSE grammar requires, so `EventSource` never dispatches. Every frame of every
generated prompt trips `event_str.endswith("\\n\\n")`.
