`SECRET_..._END` string supplied through `project_secrets`, matching no provider pattern, so
the explicit-secret replacement is the only thing standing between it and the prompt. With
that clause gone the value reaches `assemble_prompt` and both assertions fail.

This leaves a real gap, recorded as a finding rather than papered over: nothing in the suite
proves `assemble_prompt` REFUSES a bare `str`. The type annotation is the only thing saying
so, and a type annotation is not a runtime chokepoint.

The two provider regexes below are ASSEMBLED from fragments rather than written out, which is
this repository's standing rule for a credential shape in tracked source
(`.antigravity/steering/secret-safety.md`, and `scripts/check-added-shapes.py`'s own pattern
table). The first draft of this row spelled them and the pre-commit hook blocked the commit,
which is the gate working.
"""
patch = """
import re

from src.secrets import redaction

_PAT_TOKEN = "gh" + "p_" + "[a-zA-Z0-9]{36}"
_PAT_KEYID = "AK" + "IA" + "[A-Z0-9]{16}"


def _pattern_table_only(text, project_secrets=None):
    result = text
    # The caller's declared secrets are no longer replaced. The provider patterns still are,
    # so redaction looks alive and only the explicit half is missing.
    result = re.sub(_PAT_TOKEN, "FORGEOPS_REDACTED_PATTERN", result)
    result = re.sub(_PAT_KEYID, "FORGEOPS_REDACTED_PATTERN", result)
    return result


redaction._redact_text = _pattern_table_only
"""

