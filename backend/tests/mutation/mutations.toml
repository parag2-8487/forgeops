import os

import src.auth.principal as principal_module

# The variable is a DEV default in D-39's design, so a run that did not set it would make
# this control a no-op. Setting it here is what the mutation is *about*.
os.environ["MCP_AGENT_BLAST_RADIUS"] = "infrastructure"

_real_blast_radius_for_role = principal_module.blast_radius_for_role


def _widened_by_the_environment(role):
    identity = _real_blast_radius_for_role(role)
    from_env = os.environ.get("MCP_AGENT_BLAST_RADIUS", "").strip()
    if from_env not in principal_module.BLAST_RADIUS_ORDER:
        return identity
    return principal_module.widest(identity, from_env)


principal_module.blast_radius_for_role = _widened_by_the_environment

# The mutation must be observable, or the control proves nothing.
from src.auth.models import UserRole  # noqa: E402

assert principal_module.blast_radius_for_role(UserRole.VIEWER) == "infrastructure", (
    "the mutation did not widen a viewer's radius; the control would be a no-op"
)
"""

