is reused for every later frame on the same socket. §3.1 is explicit that the per-message
`SISMEMBER` is the GUARANTEE and the pub/sub close is only an optimisation; this control turns the
guarantee back into the optimisation and nothing else changes — the check still runs, still reads
real Redis, still fails closed. It just stops being asked again.

That is the whole difficulty of the bug: a cached check is indistinguishable from a correct one
for every test that revokes before the first frame arrives. `test_q16_immediate_revocation.py`
therefore generates the POSITION of the revocation inside the stream (0 to 4 frames answered
first), the METHOD the next frame carries, and how many frames queue behind it. Under the mutation
the clause fails for every generated position except zero, which is exactly the range a
hand-written example is least likely to cover.

The assertion that bites is on the COUNT of results — the hub must answer exactly the frames that
preceded the revocation and stop — rather than on "the last frame produced no result", because a
cached check answers every frame in the stream and a count is what shows it.
`::test_a_replica_that_never_subscribed_still_refuses` fails for the same reason with no subscriber
present at all, and `::test_the_control_shows_an_unrevoked_device_is_answered_every_time` keeps the
whole file from passing for a hub that closes 4403 unconditionally.

Leaf 8.4's `tests/integration/test_agent_hub.py::TestRevocationTakesEffectOnTheNextMessage` also
objects, and its doubles are imported by the property rather than copied: two definitions of "a
directory whose `is_revoked` reads the real Redis set" is how a property comes to quantify over a
shape the integration tests never exercise.
"""
patch = """
import src.websocket.hub as hub_module

_real_live = hub_module.AgentHub._live
_answered: dict[tuple[int, str], bool] = {}


async def _once_per_connection(self, ws, device_id):
    key = (id(ws), str(device_id))
    if key not in _answered:
        _answered[key] = await _real_live(self, ws, device_id)
    return _answered[key]


hub_module.AgentHub._live = _once_per_connection

# The mutation must be OBSERVABLE before the property runs, or the control proves nothing. A
# duck-typed self is enough: `_live` reads `self._deps.devices.is_revoked` and, for an unrevoked
# device, returns True without touching the socket.
import asyncio  # noqa: E402
from types import SimpleNamespace  # noqa: E402

_calls = 0


async def _is_revoked(device_id):
    global _calls
    _calls += 1
    return False


_probe = SimpleNamespace(_deps=SimpleNamespace(devices=SimpleNamespace(is_revoked=_is_revoked)))
_socket = object()


async def _observe():
    await hub_module.AgentHub._live(_probe, _socket, "11111111-1111-4111-8111-111111111111")
    await hub_module.AgentHub._live(_probe, _socket, "11111111-1111-4111-8111-111111111111")


asyncio.run(_observe())
assert _calls == 1, (
    f"the underlying revocation check ran {_calls} times for two frames; the cache did not install "
    "and the control would be a no-op"
)
